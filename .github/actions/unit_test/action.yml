name: Unit Tests
author: Bert Pluymers
description: Run unit tests with coverage at a specific Python version, dependency resolution, and numba JIT mode.

inputs:
    uv_version:
        required: true
        description: "Version of uv to be used."
    python_version:
        required: false
        description: "Python version. Empty string uses .python-version."
        default: ""
    dependency_resolution:
        required: false
        description: "uv resolution strategy: 'highest' (default) or 'lowest-direct'."
        default: "highest"
    jit:
        required: false
        description: "'off' runs under NUMBA_DISABLE_JIT, so coverage measures the bodies of the numba-compiled functions as plain Python; 'on' (default) runs with JIT on."
        default: "on"

runs:
    using: composite
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ inputs.uv_version }}
          # Distinct cache key per combo (incl. Python, since wheels are cpXY-specific) so
          # parallel jobs don't race to save one shared key or restore the wrong interpreter's wheels.
          cache-suffix: py${{ inputs.python_version }}-${{ inputs.dependency_resolution }}

      - name: Determine Python version and dependency resolution
        shell: bash
        env:
          REQUESTED: ${{ inputs.python_version }}
          RES: ${{ inputs.dependency_resolution }}
        run: |  # zizmor: ignore[github-env] values are workflow-controlled, not user input
          PY="${REQUESTED:-$(cat .python-version)}"
          # every later `uv sync` and `uv run` reads UV_PYTHON and UV_RESOLUTION, so all of them resolve
          # the same environment
          echo "UV_PYTHON=$PY" >> "$GITHUB_ENV"
          echo "UV_RESOLUTION=$RES" >> "$GITHUB_ENV"
          echo "Using Python $PY."

      - name: Drop the checked-out lock so each combo resolves fresh from pyproject
        shell: bash
        # uv re-resolves per UV_RESOLUTION even with a lock present, but removing the committed lock
        # guarantees the matrix job is never pinned by it.
        run: rm -f uv.lock

      - name: Disable numba JIT when jit is off
        if: inputs.jit == 'off'
        shell: bash
        # With jit off, njit returns the plain Python function, so coverage.py sees the lines and branches
        # inside the numba-compiled functions; tests marked only_with_numba_jit skip (tests/conftest.py).
        run: echo "NUMBA_DISABLE_JIT=1" >> "$GITHUB_ENV"  # zizmor: ignore[github-env] constant value, not user input

      # numba reuses cached compiled code only when all of these match:
      #   - the numba version
      #   - the Python version
      #   - the CPU
      #   - the (mtime, size) of the function's source file
      # numba checks no file contents and no package versions. A fresh venv gives every installed file a
      # new mtime, so no cached code would ever match.
      #
      # The jit-on jobs therefore set every third-party .py file to one fixed mtime, and key the cache on
      # the exact installed package versions: the same versions install the same source files, which
      # makes up for numba not checking file contents.
      #
      # Tag pushes (releases) skip the cache, so release tests never load compiled code that another run
      # saved.
      - name: Install the environment and set its third-party source mtimes to a fixed time
        id: numba-cache-env
        if: inputs.jit == 'on' && github.ref_type != 'tag'
        shell: bash
        run: |  # zizmor: ignore[github-env] constant values, not user input
          # the later `uv run` steps resolve the same environment through UV_PYTHON and UV_RESOLUTION, so
          # they install nothing and the fixed mtimes stay
          uv sync --group dev
          # sunnbear itself is an editable install from the checkout, outside site-packages, so this leaves
          # its source untouched. 946684800 is 2000-01-01.
          find .venv/lib/python*/site-packages -name '*.py' -exec touch -d @946684800 {} +
          INSTALLED_VERSIONS_HASH=$(uv pip freeze --python .venv/bin/python --exclude-editable | sha256sum | cut -d' ' -f1)
          echo "installed-versions-hash=$INSTALLED_VERSIONS_HASH" >> "$GITHUB_OUTPUT"
          echo "NUMBA_CACHE_DIR=$RUNNER_TEMP/numba-cache" >> "$GITHUB_ENV"
          # a generic CPU target makes the cached code independent of the runner's CPU model; the cost is
          # that the jit-on tests run code built without the host CPU's specific instructions
          echo "NUMBA_CPU_NAME=generic" >> "$GITHUB_ENV"

      - name: Restore and save numba's compiled code
        if: steps.numba-cache-env.outcome == 'success'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/numba-cache
          # the cache step sets no restore-keys, so a cache is only ever restored for the exact same
          # installed versions
          key: numba-${{ runner.os }}-${{ runner.arch }}-py${{ env.UV_PYTHON }}-${{ inputs.dependency_resolution }}-${{ steps.numba-cache-env.outputs.installed-versions-hash }}

      - name: Run tests
        shell: bash
        env:
          # distinct per-combo data file so the coverage job combines rather than overwrites
          COVERAGE_FILE: .coverage.${{ inputs.python_version }}-${{ inputs.dependency_resolution }}-jit-${{ inputs.jit }}
        # --cov-fail-under=0: the coverage job applies the fail_under check to the combined data of all matrix jobs, so no single job applies it
        run: uv run --group dev pytest ./tests --cov --cov-report= --cov-fail-under=0 --durations=20

      - name: Dump collected node-ids (for the cross-combo test-count union)
        shell: bash
        env:
          PY: ${{ env.UV_PYTHON }}
          RES: ${{ inputs.dependency_resolution }}
          JIT: ${{ inputs.jit }}
        run: |
          # each combo records its own collected set so the coverage job can union them
          uv run --group dev pytest ./tests --collect-only -q \
            | grep '::' > "test-ids-${PY}-${RES}-jit-${JIT}.txt"

      - name: Upload coverage + node-id data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ inputs.python_version }}-${{ inputs.dependency_resolution }}-jit-${{ inputs.jit }}
          path: |
            .coverage.*
            test-ids-*.txt
          include-hidden-files: true  # .coverage.* are dotfiles, excluded by default
          if-no-files-found: error
