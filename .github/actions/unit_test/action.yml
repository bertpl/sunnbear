name: Unit Tests
author: Bert Pluymers
description: Run unit tests with coverage at a specific Python version, dependency resolution, and numba JIT mode.

inputs:
    uv_version:
        required: true
        description: "Version of uv to be used."
    python_version:
        required: false
        description: "Python version. Empty string uses .python-version."
        default: ""
    dependency_resolution:
        required: false
        description: "uv resolution strategy: 'highest' (default) or 'lowest-direct'."
        default: "highest"
    jit:
        required: false
        description: "'off' runs under NUMBA_DISABLE_JIT, so coverage measures the bodies of the numba-compiled functions as plain Python; 'on' (default) runs with JIT on."
        default: "on"

runs:
    using: composite
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ inputs.uv_version }}
          # Distinct cache key per combo (incl. Python, since wheels are cpXY-specific) so
          # parallel jobs don't race to save one shared key or restore the wrong interpreter's wheels.
          cache-suffix: py${{ inputs.python_version }}-${{ inputs.dependency_resolution }}

      - name: Determine Python version and dependency resolution
        shell: bash
        env:
          REQUESTED: ${{ inputs.python_version }}
          RES: ${{ inputs.dependency_resolution }}
        run: |  # zizmor: ignore[github-env] values are workflow-controlled, not user input
          PY="${REQUESTED:-$(cat .python-version)}"
          # every later `uv run` reads UV_PYTHON and UV_RESOLUTION, so all of them resolve the same
          # environment
          echo "UV_PYTHON=$PY" >> "$GITHUB_ENV"
          echo "UV_RESOLUTION=$RES" >> "$GITHUB_ENV"
          echo "Using Python $PY."

      - name: Drop the checked-out lock so each combo resolves fresh from pyproject
        shell: bash
        # uv re-resolves per UV_RESOLUTION even with a lock present, but removing the committed lock
        # guarantees the matrix job is never pinned by it.
        run: rm -f uv.lock

      - name: Disable numba JIT when jit is off
        if: inputs.jit == 'off'
        shell: bash
        # With jit off, njit returns the plain Python function, so coverage.py sees the lines and branches
        # inside the numba-compiled functions; tests marked only_with_numba_jit skip (tests/conftest.py).
        run: echo "NUMBA_DISABLE_JIT=1" >> "$GITHUB_ENV"  # zizmor: ignore[github-env] constant value, not user input

      - name: Run tests
        shell: bash
        env:
          # distinct per-combo data file so the coverage job combines rather than overwrites
          COVERAGE_FILE: .coverage.${{ inputs.python_version }}-${{ inputs.dependency_resolution }}-jit-${{ inputs.jit }}
        # --cov-fail-under=0: the coverage job applies the fail_under check to the combined data of all matrix jobs, so no single job applies it
        run: uv run --group dev pytest ./tests --cov --cov-report= --cov-fail-under=0 --durations=20

      - name: Dump collected node-ids (for the cross-combo test-count union)
        shell: bash
        env:
          PY: ${{ env.UV_PYTHON }}
          RES: ${{ inputs.dependency_resolution }}
          JIT: ${{ inputs.jit }}
        run: |
          # each combo records its own collected set so the coverage job can union them
          uv run --group dev pytest ./tests --collect-only -q \
            | grep '::' > "test-ids-${PY}-${RES}-jit-${JIT}.txt"

      - name: Upload coverage + node-id data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ inputs.python_version }}-${{ inputs.dependency_resolution }}-jit-${{ inputs.jit }}
          path: |
            .coverage.*
            test-ids-*.txt
          include-hidden-files: true  # .coverage.* are dotfiles, excluded by default
          if-no-files-found: error
