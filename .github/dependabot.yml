version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" scans .github/workflows; each composite action under .github/actions
    # needs its own entry for the `uses:` pins inside it to be tracked.
    directories:
      - "/"
      - "/.github/actions/unit_test"
      - "/.github/actions/pre_commit"
    schedule:
      interval: "weekly"
    # `chore` prefix makes the PR title (and thus the squash commit on main) follow
    # the repo's `<type>: <summary>` convention, so the preflight title check needs
    # no Dependabot exemption.
    commit-message:
      prefix: "chore"
    # Split by update type: auto-merge is decided per PR from its update type, so a
    # single major in a shared batch would park every minor/patch bump behind review.
    groups:
      actions:  # minor/patch batch: auto-merges once checks pass
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:  # majors batch separately and wait for review
        patterns: ["*"]
        update-types: ["major"]
    # Let releases age before PRs open: auto-merged patch/minor bumps then sit
    # long enough for upstream compromises to surface before they can land.
    cooldown:
      default-days: 7  # zizmor's dependabot-cooldown floor; ~no-op at weekly cadence anyway
      # No semver-major-days here (unlike the uv entry): uv delays majors longer
      # because files can be added to a PyPI release after it is published;
      # SHA-pinned actions have no equivalent window.

  - package-ecosystem: "uv"
    # lockfile-only: bump uv.lock to the latest that still satisfies pyproject,
    # without touching the constraints themselves — the per-Python floors are
    # deliberate minimums, not upgrade targets.
    directory: "/"
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      python:  # minor/patch batch: auto-merges once checks pass
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-major:  # majors batch separately and wait for review
        patterns: ["*"]
        update-types: ["major"]
    cooldown:
      default-days: 7  # zizmor's dependabot-cooldown floor; ~no-op at weekly cadence anyway
      semver-major-days: 14
