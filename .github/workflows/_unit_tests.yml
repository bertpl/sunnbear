name: Unit tests (full matrix)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: py${{ matrix.python }} / ${{ matrix.resolution }} / jit-${{ matrix.jit }}
    # The matrix runs on ARM, not x64, because the suite runs faster on GitHub's ARM runners and nothing in
    # the suite depends on the architecture. Every dependency ships an aarch64 wheel even at the lowest
    # version that pyproject.toml allows, so the lowest-direct matrix entries also install wheels.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-only: pure Python + numpy/matplotlib, no OS-specific paths, so one OS covers all.
        #
        # - jit-off jobs run under NUMBA_DISABLE_JIT, so coverage measures the bodies of sunnbear's
        #   numba-compiled functions as plain Python.
        # - jit-on jobs (one per Python) prove that those functions compile under numba, and run the
        #   tests marked only_with_numba_jit.
        #
        # Every matrix job collects coverage, so the lines that only the only_with_numba_jit tests
        # reach are measured too, and the coverage job combines their data.
        include:
          - { python: "3.12", resolution: lowest-direct, jit: "off" }
          - { python: "3.12", resolution: highest,       jit: "on"  }
          - { python: "3.13", resolution: highest,       jit: "on"  }
          - { python: "3.14", resolution: highest,       jit: "off" }
          - { python: "3.14", resolution: lowest-direct, jit: "on"  }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/unit_test
        with:
          uv_version: ${{ vars.UV_VERSION }}
          python_version: ${{ matrix.python }}
          dependency_resolution: ${{ matrix.resolution }}
          jit: ${{ matrix.jit }}

  coverage:
    name: coverage
    # Cumulative gate: combine every combo's data into one picture before checking the
    # floor, so version-/dependency-divergent code paths (only hit on some combos) don't
    # read as uncovered.
    needs: [core]
    # always() so a cancelled/failed combo makes this job FAIL explicitly rather than
    # skip — GitHub doesn't reliably propagate a cancelled job through needs.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix combo to have succeeded
        if: needs.core.result != 'success'
        run: |
          echo "::error::test matrix did not fully succeed (core result: ${{ needs.core.result }})"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ vars.UV_VERSION }}
      - name: Download coverage data from all matrix combos
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine and report (fails below the [tool.coverage.report] floor)
        run: |
          uv run --group dev coverage combine
          uv run --group dev coverage report
      - name: Compute release metrics (coverage % + test count)
        run: uv run --group dev python .github/scripts/ci_compute_metrics.py metrics.json
      - name: Upload release metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metrics
          path: metrics.json
