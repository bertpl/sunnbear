name: Pull Request

on:
  pull_request:
    # No base-branch filter: stacked PRs (base = another feature branch) get the
    # same pipeline as main-based ones. `edited` re-runs the PR-title check on
    # title edits.
    types: [opened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap PR-metadata gates bundled into one job, so the expensive jobs fail
  # fast behind a single check.
  preflight:
    runs-on: ubuntu-latest
    env:
      # COMMIT_TYPES lists the allowed commit types as a regex alternation; the
      # branch-name and PR-title checks both use it. It stays unquoted inside
      # [[ =~ ]], because bash matches a quoted right-hand side literally. Keep it
      # in sync with the conventional-pre-commit args in .pre-commit-config.yaml,
      # which add `release` for release-automation commits.
      COMMIT_TYPES: feat|fix|internal|chore|docs|refactor|test
    steps:
      # PR author, not github.actor — a human re-running checks on a Dependabot PR
      # must not un-exempt it (Dependabot branches don't follow the convention).
      - name: Check branch name
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(${COMMIT_TYPES})/[a-z0-9-]+$ ]]; then
            echo "::error::Branch name '$BRANCH' does not match ^(${COMMIT_TYPES})/[a-z0-9-]+\$"
            exit 1
          fi

      # The repo squash-merges, so the PR title becomes the commit subject on
      # main — the CI complement to the local commit-msg hook. Dependabot PRs pass
      # too: dependabot.yml sets the `chore` commit-message prefix.
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(${COMMIT_TYPES}):[[:space:]].+ ]]; then
            echo "::error::PR title '$PR_TITLE' does not match '<type>: <summary>' (type in ${COMMIT_TYPES})"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changelog updated for feat/ and fix/ branches
        env:
          BRANCH: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feat|fix)/ ]]; then
            echo "Branch '$BRANCH' is not feat/ or fix/; changelog entry not required."
            exit 0
          fi
          if git diff --name-only "$BASE_SHA...HEAD" | grep -q '^CHANGELOG\.md$'; then
            echo "CHANGELOG.md was modified — OK."
            exit 0
          fi
          echo "::error::feat/ and fix/ PRs must update CHANGELOG.md."
          exit 1

  pre-commit:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pre_commit
        with:
          uv_version: ${{ vars.UV_VERSION }}

  test:
    needs: [preflight]
    uses: ./.github/workflows/_unit_tests.yml

  # Package-integrity gate: build + blind-install the wheel and test it (see _package_check.yml).
  package:
    needs: [preflight]
    uses: ./.github/workflows/_package_check.yml

  # Synchronous dependency-CVE gate: audits the locked runtime dependencies
  # against the advisory DB at PR time — the blocking complement to the async,
  # repo-level Dependabot alerts. Hard-fails on any advisory; accepted ones go
  # in `ignore-vulns` below with a justification.
  pip-audit:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ vars.UV_VERSION }}
      - name: Export the locked runtime dependencies
        # --no-default-groups (not --no-dev): the notebooks default group is
        # maintainer tooling, not part of the shipped runtime closure
        run: uv export --frozen --no-emit-project --no-default-groups --no-hashes --format requirements-txt -o requirements.txt
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
          no-deps: "true"  # requirements.txt is already the full pinned closure
          # Accepted/unfixable advisories go here (one id per line) with a reason:
          # ignore-vulns: |
          #   GHSA-xxxx-xxxx-xxxx  # why accepted

  ci-gate:
    name: CI gate
    # The gate is the single stable required check on main: branch protection
    # requires only the gate, so the job set can change without re-touching repo
    # settings. Without `always()`, an upstream failure would skip the gate, and
    # GitHub treats a skipped required check as passing.
    #
    # The gate passes only when every job in `needs` ended in `success`.
    #
    # A job skipped by its own `if:` reports `skipped`, the same result as a job
    # skipped because an upstream job failed or was cancelled. The gate cannot
    # tell these cases apart, so it fails on any `skipped` result, and no job in
    # `needs` may skip itself.
    #
    # A job whose work applies only to some runs therefore always runs, and
    # inside the job it:
    #   - decides whether the work applies;
    #   - succeeds without doing the work when it does not;
    #   - sets a job output if a later job needs to know whether the work ran.
    if: always()
    needs: [preflight, pre-commit, test, package, pip-audit]
    runs-on: ubuntu-latest
    steps:
      # The script checks the job results itself: a step-level `if:` can skip
      # the step silently and let the gate pass.
      - name: Fail unless every required job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "::error::One or more required jobs did not succeed."
            exit 1
          fi
