# Reusable package-integrity check: build the distribution once, verify the
# wheel statically, then blind-install it into a bare environment and run the
# test suite against it. Guards the packaging layer (empty sdist/wheel, missing
# subpackages, broken metadata) that editable-install test runs never see.
# Called from the PR pipeline (behind ci-gate) and from the release pipeline
# (before publish, which reuses the exact artifact tested here).
name: Package check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ vars.UV_VERSION }}
          enable-cache: false  # never restore this build output from a poisonable cache; on release runs it becomes the published artifact

      - name: Build sdist + wheel
        run: uv build

      # Static gate: catches structurally broken wheels (empty, missing the
      # declared import package, ...) before the install job spins up.
      - name: Check wheel contents
        run: uv run --frozen --no-default-groups --group package check-wheel-contents dist/*.whl

      - name: Upload distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install-test:
    needs: [build]
    # This job runs on ARM, like the unit test matrix, because the suite runs faster there.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ vars.UV_VERSION }}

      - name: Download distribution artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Blind environment: test deps come lockfile-pinned from the dev group
      # (--no-emit-project keeps the project itself out), and sunnbear can only
      # come from the built wheel — never an editable/source install.
      - name: Install the built wheel into a bare environment
        run: |
          uv export --frozen --no-emit-project --only-group dev -o requirements.txt
          uv venv blind-venv
          uv pip install --python blind-venv/bin/python -r requirements.txt
          WHEEL=(dist/*.whl)
          uv pip install --python blind-venv/bin/python "sunnbear @ file://$PWD/${WHEEL[0]}"

      - name: Run the test suite against the installed wheel
        env:
          # Setting this variable makes tests/conftest.py fail the run when the tests import sunnbear from anywhere but site-packages
          SUNNBEAR_TESTS_NEEDS_INSTALLED_WHEEL: "1"
        run: blind-venv/bin/python -m pytest tests/ -n auto
