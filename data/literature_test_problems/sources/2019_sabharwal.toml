title = 'Sabharwal (2019): blended bisection and regula falsi'
reference = 'Sabharwal, C. L. (2019). Blended Root Finding Algorithm Outperforms Bisection and Regula Falsi Algorithms. Mathematics 7(11), 1118. https://doi.org/10.3390/math7111118.'
year = 2019
subcategory = '1.2'
where_in_source = '''
- Figures 1–4 (Section 2.2.3, pp. 5–6) plot runs of the false position method on 4 functions, with tolerance `0.00001` and at most 10 iterations, to show that 1 endpoint stays fixed. Each plot title gives the function and the interval.
- Table 2, "From the literature function, domain interval and author of the function" (Section 5.2, p. 12), lists 11 functions, each with an interval and an author. Section 5.2 says that the article's algorithm was tested on all of them, but the article prints results only for `x^2 - x - 2` on `[1, 4]` (`T2.4`).
- Not in the rows: Section 2.3.2's `x^2 - 1` and `x^3`, each from `r0 = 0`, which illustrate the first step of Newton's method without a run; and Section 2.5's `x^2`, which the article names as another article's genetic-algorithm experiment, with no interval.
'''
transcribed_from = 'the article: Table 2 from its text layer, checked against the page image; Figures 1–4 from the plot titles in the page images.'
rows_summary = "15: the 4 functions of Figures 1–4 and Table 2's 11."
notes = '''
- **Keys:** the figures and Table 2 do not number the functions, so a key `Fig. k` gives the figure, and a key `T2.k` the position within Table 2.
- **Figures 1–4:** a row's `notes` give the fixed endpoint that the figure's caption states.
- **`also_in`:** Table 2's column "Reference" names 1 author per function, which `also_in` gives as printed. Table 2 prints no reference numbers; `also_in` adds the number of the matching entry in the reference list. These entries are:
  - [2] Calhoun, a web page of Boise State University; Table 2 spells the name "Calhun";
  - [12] Srivastava & Srivastava (2011), Journal of Chemical, Biological and Physical Sciences;
  - [14] Ehiwario & Aghamie (2014), IOSR Journal of Engineering;
  - [15] Sivanandam & Deepa (2008), Introduction to Genetic Algorithms, a chapter on genetic algorithms in MATLAB;
  - [16] Moazzam, Chakraborty & Bhuiyan (2012), International Journal of Computer Science Issues;
  - [17] Harder, Numerical Analysis for Engineering, web pages of the University of Waterloo;
  - [18] Mathews & Fink, Numerical Methods Using Matlab, 4th ed. (2004); Table 2 spells the name "Mathew";
  - [19] Nayak & Dash (2012), conference AIRES-2012.
'''

[[relations]]
sources = ['2021_badr']
text = '''
`P1`–`P9` of Badr, Almotairi & El Ghamry (2021) are `T2.1`–`T2.5` and `T2.7`–`T2.10`, in the same order and with the same expressions and authors. Badr compares its method with this article's, but does not name this article as the source of its problems: its Table 1 cites the original authors. The differences:
- **`P7` (`T2.8`, `x*exp(x) - 7`):** Badr gives `[0, 2]`, which brackets the root; this article gives `[-1, 1]`, which does not.
- **`T2.6` and `T2.11`**, the 2 functions cited to Sivanandam, are not in Badr. Neither changes sign on its interval.
- **`P10`–`P15`** are not in this article; Badr cites Esfandiari, Chapra and Hoffman for them.
- Badr spells the authors of `P7` and `P9` "Callhoun" and "Mathews", where Table 2 has "Calhun" and "Mathew".
'''

[[relations]]
sources = ['roots_fortran']
text = '''
Cases 103–111 of roots-fortran are Badr's `P1`–`P9`, so they hold `T2.1`–`T2.5` and `T2.7`–`T2.10`. The differences from this article:
- **Case 105 (`T2.3`, `x^2 - 10`):** `[3, 7]`, where this article and Badr have `[3, 4]`.
- **Case 109 (`T2.8`):** `[0, 2]`, as in Badr, where this article has `[-1, 1]`.
- Cases 112–117 are Badr's `P10`–`P15`, which are not in this article.
'''

[[rows]]
key = 'Fig. 1'
f = '4 - (x - 1)^3'
interval = '[1.00, 4.00]'
notes = 'The right endpoint stays fixed. Root `1 + 4^(1/3)`.'

[[rows]]
key = 'Fig. 2'
f = '4 - (3 - x)^3'
interval = '[0.20, 3.50]'
notes = 'The left endpoint stays fixed. Root `3 - 4^(1/3)`.'

[[rows]]
key = 'Fig. 3'
f = 'x^9 - 8'
interval = '[0.00, 1.50]'
notes = 'The right endpoint stays fixed. Root `2^(1/3)`.'

[[rows]]
key = 'Fig. 4'
f = '(1.5 - x)^9 - 8'
interval = '[0.00, 1.50]'
notes = 'The left endpoint stays fixed. Root `1.5 - 2^(1/3)`.'

