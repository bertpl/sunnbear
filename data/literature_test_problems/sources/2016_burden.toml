text = '''
Tiruneh (2019) (`2019_tiruneh`) cites no source for its functions, and 3 of them are in this chapter:
- **T1.1 is the chapter's running example** `x^3 + 4*x^2 - 10`, from starting points. Weerakoon & Fernando (2000)'s function 1 (`2000_weerakoon`) and Cadenas's f1 (`2026_cadenas_reflected_box`) are the same function; roots-fortran's case 63 (`roots_fortran`) takes it from Tiruneh, on `[0, 1.5]` where the book has `[1, 2]`.
- **T2.5 is 2.3-D3**, solved for its roots `4 + sqrt(5)` and `4 - sqrt(5)`, where the book seeks its root 4.
- **T2.6 is 2.3-D4**, `x^(1/3)`, from other starting points; Gao (2026) (`2026_gao`), Jo (2024) (`2024_jo_annealing`) and Romadani (2025) (`2025_romadani_python_implementations`) hold it too.
'''

