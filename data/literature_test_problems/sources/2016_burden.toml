title = 'Burden, Faires, Burden (2016): Numerical Analysis, chapter 2'
reference = 'Burden, R. L., Faires, J. D., Burden, A. M. (2016). Numerical Analysis, 10th edition. Cengage Learning, Boston, MA. ISBN 978-1-305-25366-7. The copyright page gives © 2016 and the print year 2014.'
year = 2016
subcategory = '1.4'
where_in_source = '''
chapter 2, "Solutions of Equations in One Variable" (pp. 47–102): the introduction, Sections 2.1–2.7 with their examples and illustrations, Tables 2.1–2.13, Figures 2.1–2.13, and the exercise sets that end Sections 2.1–2.6.
- Each exercise set numbers its exercises, applied exercises and theoretical exercises in 1 sequence, and its discussion questions apart. Section 2.7 has only discussion questions, none with a function.
- Exercises 2.3-7 to 2.3-10 repeat 2.3-5 and 2.3-6 with the secant method and false position; 2.4-3 and 2.4-4 repeat 2.4-1 and 2.4-2 with the modified Newton method (2.13); 2.6-3 and 2.6-4 repeat 2.6-1 and 2.6-2 with Müller's method. The rows do not repeat those keys.
- The rows leave out:
  - the exercises and discussion questions about a method, a sequence or a generic `f` (2.1-19, 2.2-19, 2.2-21, 2.2-22(a), 2.2-25, 2.2-26, 2.3-30 to 2.3-32, 2.4-6 to 2.4-14, 2.5-5, 2.5-6, 2.5-13 to 2.5-17, and every discussion question except 2.3-D3, 2.3-D4 and 2.4-D2);
  - the Illustration of §2.4 (p. 79) and §2.5 Ex. 1, which compare or accelerate sequences;
  - the 5 word problems that the book states without an equation: 2.3-19 and 2.3-20 (the point of a curve nearest a given point), 2.3-21 (2 numbers with a given sum), 2.6-8 (crossed ladders) and 2.6-9 (a can made of the least material);
  - 2.3-25 and 2.3-26, which fit the 3 constants of a population model to census data on p. 103, outside the chapter.
'''
transcribed_from = 'the scanned PDF of the chapter, whose text layer comes from OCR. Every expression was read from the page images; the exercise sets of Sections 2.1, 2.3 and 2.6 were also checked against the text layer.'
rows_summary = '116, 1 per distinct function: a function that several examples or exercises use is 1 row whose key lists them all. 12 rows come from the introduction, the text, its examples, illustrations and figures, and the exercises reuse 4 of them; 104 rows come from the exercises and discussion questions alone.'
notes = '''
How to read the rows:
- **Keys:**
  - `§2.k Ex. n` is Example n of Section 2.k, since the book numbers its examples per section;
  - `§2.k Ill. (p. n)` is an Illustration;
  - `§2.k (p. n)` is an example in the text or a margin note;
  - `§2 (pp. 47–48)` is the chapter introduction;
  - `2.k-m` is exercise m of Exercise Set 2.k, with its part letter, and `2.k-Dm` is its discussion question m;
  - `Table` and `Fig.` are the book's tables and figures.
- **Equations:** an equation that the book prints as `lhs = rhs` stays in that form; `f(x) = 0` is written as `f(x)`.
- **Fixed-point problems:** a fixed-point problem, which the book states as `x = g(x)` or as an iteration `p_n = g(p_{n-1})`, is written as `x = g(x)` and is its own row, except where the book derives it from a root problem: then its forms are in that row's notes (§2.2 Ill. (p. 60), §2.3 Ex. 1, 2.2-1, 2.2-3, 2.2-4).
- **Notation:** the book writes `ln` for the natural log; the rows write `log`. It gives an interval as `[a, b]` or as `a <= x <= b`; the rows write `[a, b]`.

Other sources with the same function:
- `x^3 - 2*x - 5`, `cos(x) - x` and `x - cos(x)` are in many sources, on other intervals or from starting points.
- `x^2 - 3` on `[1, 2]` is Badr's P1 (`2021_badr`) and Sabharwal's T2.1 (`2019_sabharwal`), both citing Harder, *Numerical Analysis for Engineering*; 2.1-14 gives no interval.
- `x = cos(x)` is in Bradie (2.3-5) (`2006_bradie`) and Epperson (3.1-4) (`2013_epperson`). `x = tan(x)` is Moler's Ex. 4.9 (`2004_moler`), and Atkinson's P3 (`1989_atkinson`) is `x - tan(x)`.
- 2.2-20's `x = 2*x - A*x^2` is Newton's iteration for `1/x - A`, as in Atkinson (2.0.3), Bradie's 2.4-8 and Epperson's §3.4. The `x = (1/2)*x + A/(2*x)` of 2.2-23 and 2.2-24 is Newton's iteration for `x^2 - A`, as in Atkinson (2.5.3), Bradie's 2.4-7 and Epperson's §3.9.
'''

