notes = "Fixed-point iteration to `1E-5` on an interval of the reader's choice, with an estimate of the number of iterations (2.2-13); Aitken's method on the iteration from `p0 = 0.5` (2.5-1); Steffensen's method to `1E-5` (2.5-11)."

[[rows]]
key = '2.2-13(b)'
f = 'x = 5/x^2 + 2'
notes = 'Fixed-point iteration as in 2.2-13(a).'

[[rows]]
key = '2.2-13(c); 2.5-1(b); 2.5-11(c)'
f = 'x = (exp(x)/3)^(1/2)'
notes = 'As 2.2-13(a); 2.5-1 starts from `p0 = 0.75`.'

[[rows]]
key = '2.2-13(d); 2.5-11(d)'
f = 'x = 5^-x'
notes = "Fixed-point iteration as in 2.2-13(a); Steffensen's method (2.5-11)."

[[rows]]
key = '2.2-13(e)'
f = 'x = 6^-x'
notes = 'Fixed-point iteration as in 2.2-13(a).'

[[rows]]
key = '2.2-13(f); 2.5-11(b)'
f = 'x = 0.5*(sin(x) + cos(x))'
notes = 'As 2.2-13(d).'

[[rows]]
key = '2.2-14(a); 2.5-12(a)'
f = '2 + sin(x) - x'
interval = '[2, 3]'
notes = "Fixed-point iteration to `1E-5` with a function `g` of the reader's choice (2.2-14); Steffensen's method on that `g` (2.5-12)."

[[rows]]
key = '2.2-14(c); 2.5-12(c)'
f = '3*x^2 - exp(x)'
notes = "As 2.2-14(a), on an interval of the reader's choice. 2.3-6(e) has its negative."

[[rows]]
key = '2.2-14(d); 2.3-5(c); 2.5-12(d)'
f = 'x - cos(x)'
interval = '`[0, pi/2]` (2.3-5)'
notes = 'As 2.2-14(a); Newton to `1E-4` (2.3-5). The negative of the function of §2.3 Ex. 1.'

[[rows]]
key = '2.2-15'
f = 'x^2 + 10*cos(x)'
notes = "All zeros to `1E-4`, by fixed-point iteration with a function of the reader's choice."

[[rows]]
key = '2.2-17'
f = '2*sin(pi*x) + x'
interval = '[1, 2]'
notes = 'Printed as `x = 2*sin(pi*x) + x = 0`. Fixed-point iteration from `p0 = 1` to `1E-2`.'

[[rows]]
key = '2.2-18'
f = 's(t) = s0 - (m*g/k)*t + (m^2*g/k^2)*(1 - exp(-k*t/m))'
parameters = '`s0 = 300` ft, `m = 0.25` lb, `k = 0.1` lb-s/ft, `g = 32.17` ft/s^2'
notes = 'Unknown `t`, the time at which an object dropped from the height `s0`, slowed by air resistance, hits the ground: `s(t) = 0`, to 0.01 s.'

[[rows]]
key = '2.2-20'
f = 'x = 2*x - A*x^2'
parameters = 'A > 0'
notes = 'A nonzero limit of the fixed-point iteration is `1/A`, so `1/A` can be found with multiplications and subtractions only; asks for an interval about `1/A` on which the iteration converges.'

[[rows]]
key = '2.2-22(b)'
f = 'x = 1 - x^2'
interval = '[0, 1]'
notes = "A counterexample: Theorem 2.4 may fail when `abs(g'(x)) <= k` is replaced by `g'(x) <= k`."

[[rows]]
key = '2.2-23, 2.2-24'
f = 'x = (1/2)*x + A/(2*x)'
parameters = '`A > 0` (2.2-24); `A = 2` (2.2-23)'
notes = 'The iteration converges to `sqrt(A)` for every `x0 > 0`; 2.2-24(b) asks what happens for `x0 < 0`. 2.2-23 prints it at `A = 2` as `x = (1/2)*x + 1/x`.'

[[rows]]
key = '2.3-1, 2.3-3'
f = 'x^2 - 6'
interval = '`[2, 3]` (false position, 2.3-3)'
notes = 'Newton from `p0 = 1` to `p2` (2.3-1); secant and false position from `p0 = 3, p1 = 2` to `p3`, and which is closer to `sqrt(6)` (2.3-3).'

[[rows]]
key = '2.3-2, 2.3-4'
f = '-x^3 - cos(x)'
interval = '`[-1, 0]` (false position, 2.3-4)'
notes = 'Newton from `p0 = -1` to `p2`, and whether `p0 = 0` could be used (2.3-2); secant and false position from `p0 = -1, p1 = 0` to `p3` (2.3-4).'

[[rows]]
key = '2.3-5(a); 2.6-1(a)'
f = 'x^3 - 2*x^2 - 5'
interval = '[1, 4]'
notes = 'Newton to `1E-4` (2.3-5); all real zeros by Newton to `1E-4` (2.6-1).'

[[rows]]
key = '2.3-5(b); 2.6-1(b)'
f = 'x^3 + 3*x^2 - 1'
interval = '[-3, -2]'
notes = 'As 2.3-5(a). 2.4-2(b) prints, on the same interval, a function that with 1 misprint corrected is its square.'

[[rows]]
key = '2.3-5(d)'
f = 'x - 0.8 - 0.2*sin(x)'
interval = '[0, pi/2]'
notes = 'Newton to `1E-4`.'

[[rows]]
key = '2.3-6(a)'
f = 'exp(x) + 2^-x + 2*cos(x) - 6'
interval = '[1, 2]'
notes = 'Newton to `1E-5`.'

[[rows]]
key = '2.3-6(b)'
f = 'log(x - 1) + cos(x - 1)'
interval = '[1.3, 2]'
notes = 'As 2.3-6(a).'

[[rows]]
key = '2.3-6(c)'
f = '2*x*cos(2*x) - (x - 2)^2'
interval = '`[2, 3]`; `[3, 4]`'
notes = 'As 2.3-6(a).'

[[rows]]
key = '2.3-6(d)'
f = '(x - 2)^2 - log(x)'
interval = '`[1, 2]`; `[e, 4]`'
notes = 'As 2.3-6(a).'

[[rows]]
key = '2.3-6(e)'
f = 'exp(x) - 3*x^2'
interval = '`[0, 1]`; `[3, 5]`'
notes = 'As 2.3-6(a). 2.4-2(d) is its cube, and 2.2-14(c) its negative.'

[[rows]]
key = '2.3-6(f)'
f = 'sin(x) - exp(-x)'
interval = '`[0, 1]`; `[3, 4]`; `[6, 7]`'
notes = 'As 2.3-6(a).'

[[rows]]
key = '2.3-13'
f = '230*x^4 + 18*x^3 + 9*x^2 - 221*x - 9'
interval = '`[-1, 0]`; `[0, 1]`'
notes = "2 real zeros, 1 in each interval, to `1E-6`: false position and secant from the interval's endpoints, Newton from its midpoint."

[[rows]]
key = '2.3-14'
f = 'tan(pi*x) - 6'
interval = '[0, 0.48]'
notes = 'Zero `(1/pi)*arctan(6) = 0.447431543`. 10 iterations each of bisection, false position and secant from `p0 = 0, p1 = 0.48`; asks which works best, and why.'

[[rows]]
key = '2.3-15'
f = '4*x^2 - exp(x) - exp(-x)'
notes = '2 positive solutions. Newton to `1E-5` from `p0 = -10, -5, -3, -1, 0, 1, 3, 5, 10`.'

[[rows]]
key = '2.3-16'
f = 'x^2 - 10*cos(x)'
notes = 'Solutions `±1.3793646`. Newton to `1E-5` from `p0 = -100, -50, -25, 25, 50, 100`.'

[[rows]]
key = '2.3-17'
f = 'log(x^2 + 1) - exp(0.4*x)*cos(pi*x)'
notes = "Infinitely many zeros. To `1E-6`: the only negative zero, the 4 smallest positive zeros, and the 25th smallest positive zero, from an initial approximation of the reader's choice."

[[rows]]
key = '2.3-18'
f = '1/2 + (1/4)*x^2 - x*sin(x) - (1/2)*cos(2*x)'
notes = "Printed as the equation `0 = 1/2 + (1/4)*x^2 - x*sin(x) - (1/2)*cos(2*x)`. Newton to `1E-5` from `p0 = pi/2`, and why the result seems unusual for Newton's method; also from `p0 = 5*pi` and `10*pi`. It equals `(x/2 - sin(x))^2`, so every root is double."

[[rows]]
key = '2.3-23'
f = 'A = (P/i)*(1 - (1 + i)^-n)'
name = 'ordinary annuity equation'
parameters = '`A = 135000`, `P = 1000` per month, over 30 years'
notes = 'Unknown `i`, the interest rate per period: the largest rate at which payments of $1000 per month pay off a 30-year mortgage of $135,000, so `n = 360`.'

[[rows]]
key = '2.3-24'
f = 'A = (P/i)*((1 + i)^n - 1)'
name = 'annuity due equation'
parameters = '`A = 750000`, `P = 1500` per month, over 20 years'
notes = 'Unknown `i`, the interest rate per period: the smallest rate, compounded monthly, at which deposits of $1500 per month reach $750,000 in 20 years, so `n = 240`.'

[[rows]]
key = '2.3-27'
f = 'P = ((1 + p)/2)*(p/(1 - p + p^2))^21'
parameters = 'P = 1/2'
also_in = "[Keller, J], p. 267, which the book cites; Bradie's 2.5-19 cites it as Keller (1984), SIAM Review 26, 267–268"
notes = '`P` is the probability that player A shuts out player B (21–0) in racquetball, and `p` the probability that A wins a rally. Asks for the smallest `p`, to `1E-3`, for which A shuts out B in at least half the matches.'

[[rows]]
key = '2.3-28'
f = 'c(t) = A*t*exp(-t/3)'
parameters = 'maximum safe concentration 1 mg/mL; second injection at 0.25 mg/mL, of 75% of `A`'
notes = 'The concentration in mg/mL `t` hours after injecting `A` units of a drug. (a) The `A` whose maximum is 1 mg/mL, and the time of that maximum; (b) the time at which the concentration falls to 0.25 mg/mL, to the nearest minute; (c) with the second injection given then and concentrations that add, the time at which it falls to 0.25 mg/mL again.'

[[rows]]
key = '2.3-29'
f = 'A*sin(alpha)*cos(alpha) + B*sin(alpha)^2 - C*cos(alpha) - E*sin(alpha)'
parameters = '`A = l*sin(beta1)`, `B = l*cos(beta1)`, `C = (h + 0.5*D)*sin(beta1) - 0.5*D*tan(beta1)`, `E = (h + 0.5*D)*cos(beta1) - 0.5*D`; `l = 89` in, `h = 49` in, `beta1 = 11.5` degrees; `D = 55` in (a), `D = 30` in (b)'
also_in = '[Bek], which the book cites'
notes = 'Unknown `alpha`, the largest angle that an all-terrain vehicle can negotiate without nose-in failure. (a) checks that `alpha` is about 33 degrees; (b) asks for `alpha` at `D = 30` in.'

[[rows]]
key = '2.3-D3'
f = '0.5*x^3 - 6*x^2 + 21.5*x - 22'
notes = 'Zero at `x = 4`. Compares Newton from `p0 = 5` with secant from `p0 = 5, p1 = 4.5`.'

[[rows]]
key = '2.3-D4'
f = 'x^(1/3)'
notes = 'Root 0. Compares Newton from `x = 1` with secant from `p0 = 5, p1 = 0.5`.'

[[rows]]
key = '2.4-1(a)'
f = 'x^2 - 2*x*exp(-x) + exp(-2*x)'
interval = '[0, 1]'
notes = 'Newton to `1E-5`. It equals `(x - exp(-x))^2`, so its root is double.'

[[rows]]
key = '2.4-1(b)'
f = 'cos(x + sqrt(2)) + x*(x/2 + sqrt(2))'
interval = '[-2, -1]'
notes = 'As 2.4-1(a). With `u = x + sqrt(2)` it equals `cos(u) + u^2/2 - 1`: root `-sqrt(2)` of multiplicity 4.'

[[rows]]
key = '2.4-1(c)'
f = 'x^3 - 3*x^2*(2^-x) + 3*x*(4^-x) - 8^-x'
interval = '[0, 1]'
notes = "As 2.4-1(a). It equals `(x - 2^-x)^3`, the cube of 2.1-5(a)'s function."

[[rows]]
key = '2.4-1(d); 2.5-2'
f = 'exp(6*x) + 3*(log(2))^2*exp(2*x) - log(8)*exp(4*x) - (log(2))^3'
interval = '[-1, 0]'
notes = "As 2.4-1(a). It equals `(exp(2*x) - log(2))^3`. 2.5-2 runs Newton from `p0 = 0` until `abs(p_{n+1} - p_n) < 0.0002`, then Aitken's method."

[[rows]]
key = '2.4-2(a)'
f = '1 - 4*x*cos(x) + 2*x^2 + cos(2*x)'
interval = '[0, 1]'
notes = 'Newton to `1E-5`. It equals `2*(x - cos(x))^2`.'

[[rows]]
key = '2.4-2(b)'
f = 'x^6 + 6*x^5 + 9*x^4 - 2*x^3 - 6*x^2 + 1'
interval = '[-3, -2]'
notes = "As 2.4-2(a). The book prints the first term as `x^2`, a misprint: as printed, the function is negative on all of `[-3, -2]` and has no root there. With `x^6` it equals `(x^3 + 3*x^2 - 1)^2`, the square of 2.3-5(b)'s function, with a double root at -2.879385."

[[rows]]
key = '2.4-2(c)'
f = 'sin(x)^3 + 3*exp(-2*x)*sin(x) - 3*exp(-x)*sin(x)^2 - exp(-3*x)'
interval = '[3, 4]'
notes = "As 2.4-2(a). The book prints `sin 3x` and `sin 2x`, misprints for `sin(x)^3` and `sin(x)^2`: with them the 4 terms are the expansion of `(sin(x) - exp(-x))^3`, the cube of 2.3-6(f)'s function on the same `[3, 4]`, with a triple root at 3.096364. Every other part of 2.4-1 and 2.4-2 has a multiple root too (2.4-2(b) once its misprint is corrected). As printed, the function has a simple root at 3.141568."

[[rows]]
key = '2.4-2(d)'
f = 'exp(3*x) - 27*x^6 + 27*x^4*exp(x) - 9*x^2*exp(2*x)'
interval = '[3, 5]'
notes = "As 2.4-2(a). It equals `(exp(x) - 3*x^2)^3`, the cube of 2.3-6(e)'s function."

[[rows]]
key = '2.4-5'
f = 'exp(6*x) + 1.441*exp(2*x) - 2.079*exp(4*x) - 0.3330'
interval = '[-1, 0]'
notes = "2.4-1(d) with its coefficients rounded to 4 digits, as the book says. Newton and the modified Newton method (2.13) to `1E-5`, compared with the results of 2.4-1(d) and of the book's \"2(d)\". That \"2(d)\" is most likely a slip for 2.4-3(d), the modified Newton method on 2.4-1(d), because 2.4-2(d) is an unrelated function."

[[rows]]
key = '2.4-D2'
f = 'x^2*(x - 1)'
notes = 'Double root 0 and simple root 1; asks when Newton converges linearly and when quadratically.'

[[rows]]
key = '2.5-3'
f = 'x = cos(x - 1)'
notes = "Steffensen's method from `p0 = 2`, to `p0^(1)`."

[[rows]]
key = '2.5-4'
f = 'x = 1 + (sin(x))^2'
notes = "Steffensen's method from `p0 = 1`, to `p0^(1)` and `p0^(2)`."

[[rows]]
key = '2.6-1(e)'
f = 'x^3 + 4.001*x^2 + 4.002*x + 1.101'
notes = 'All real zeros by Newton to `1E-4`.'

[[rows]]
key = '2.6-1(f)'
f = 'x^5 - x^4 + 2*x^3 - 3*x^2 + x - 4'
notes = 'As 2.6-1(e).'

[[rows]]
key = '2.6-2(a)'
f = 'x^4 + 5*x^3 - 9*x^2 - 85*x - 136'
notes = 'All zeros to `1E-5`: the real ones by Newton, the complex ones by deflation.'

[[rows]]
key = '2.6-2(b)'
f = 'x^4 - 2*x^3 - 12*x^2 + 16*x - 40'
notes = 'As 2.6-2(a).'

[[rows]]
key = '2.6-2(c)'
f = 'x^4 + x^3 + 3*x^2 + 2*x + 2'
notes = 'As 2.6-2(a).'

[[rows]]
key = '2.6-2(d)'
f = 'x^5 + 11*x^4 - 21*x^3 - 10*x^2 - 21*x - 5'
notes = 'As 2.6-2(a).'

[[rows]]
key = '2.6-2(e)'
f = '16*x^4 + 88*x^3 + 159*x^2 + 76*x - 240'
notes = 'As 2.6-2(a).'

[[rows]]
key = '2.6-2(f)'
f = 'x^4 - 4*x^2 - 3*x + 5'
notes = 'As 2.6-2(a).'

[[rows]]
key = '2.6-5(a)'
f = 'x^3 - 9*x^2 + 12'
notes = 'Its zeros and critical points by Newton to `1E-3`, to sketch its graph.'

[[rows]]
key = '2.6-5(b)'
f = 'x^4 - 2*x^3 - 5*x^2 + 12*x - 5'
notes = 'As 2.6-5(a).'

[[rows]]
key = '2.6-6'
f = '10*x^3 - 8.3*x^2 + 2.295*x - 0.21141'
notes = 'Root 0.29. Newton from `x0 = 0.28`, and an explanation of what happens.'

[[rows]]
key = '2.6-7'
f = '600*x^4 - 550*x^3 + 200*x^2 - 20*x - 1'
interval = '[0.1, 1]'
notes = "A solution in the interval to `1E-4` by bisection, Newton, secant, false position and Müller's method."

[[rows]]
key = '2.6-10'
f = 'x^3 + 2*x^2 + 10*x = 20'
notes = 'The equation that Leonardo of Pisa (Fibonacci) solved in 1224: it has no rational root and only 1 real root, which he gave in base 60 as `1 + 22/60 + 7/60^2 + 42/60^3 + 33/60^4 + 4/60^5 + 40/60^6`; asks how accurate that is.'
