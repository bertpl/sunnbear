key = '§2 (pp. 47–48); 2.3-22'
f = '1564000 = 1000000*exp(lambda) + (435000/lambda)*(exp(lambda) - 1)'
interval = '`(0, 1]` (figure, p. 47)'
notes = 'Unknown `lambda`, the birthrate of a population. From the model `N(t) = N0*exp(lambda*t) + (v/lambda)*(exp(lambda*t) - 1)` with `N0 = 1000000`, immigration `v = 435000` per year and `N(1) = 1564000`; the figure on p. 47 plots `N(lambda)` in thousands up to `lambda = 1`. 2.3-22 asks for `lambda` to `1E-4`, then predicts the population after 2 years.'

[[rows]]
