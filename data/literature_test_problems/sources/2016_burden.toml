interval = '`[-4, 4]`; `[0, 1]`'
notes = '`f(-4)*f(4) < 0` and `f(0)*f(1) < 0`: bisection on `[0, 1]` needs 3 fewer iterations than on `[-4, 4]` for the same accuracy.'

[[rows]]
key = '§2.1 Ex. 1, 2; Table 2.1; §2.2 Ill. (pp. 60, 62–63), Table 2.2; §2.4 Ill. (p. 84); §2.5 Ill. (p. 89), Table 2.11'
f = 'x^3 + 4*x^2 - 10'
interval = '[1, 2]'
notes = "The chapter's running example: unique root `1.365230013` in `[1, 2]`. Bisection until the bound on the relative error is below `1E-4` gives `p13 = 1.365112305` (Ex. 1, Table 2.1); Theorem 2.1's bound gives 10 iterations for `1E-3` (Ex. 2). §2.2 rewrites it as 5 fixed-point problems, iterated from `p0 = 1.5` (Table 2.2): `g1 = x - x^3 - 4*x^2 + 10`, which diverges; `g2 = (10/x - 4*x)^(1/2)`, which becomes undefined; `g3 = (1/2)*(10 - x^3)^(1/2)`; `g4 = (10/(4 + x))^(1/2)`; and `g5 = x - (x^3 + 4*x^2 - 10)/(3*x^2 + 8*x)`, Newton's iteration. The second Illustration checks Theorem 2.4 for `g1` to `g4` on `[1, 2]`, and for `g3` on `[1, 1.5]`; it notes only that `g5` converges fastest. Newton and the modified Newton method (2.13) from `p0 = 1.5` (§2.4); Steffensen's method on `g4` from `p0 = 1.5` (§2.5, Table 2.11)."

