notes = '`x0 = -30`. Root 1.23; the other root, about 2.4767, lies outside the interval.'

[[rows]]
key = '3'
f = '11*x^11 - 1'
interval = '[0.1, 1]'
notes = '`x0 = 0.1`.'

[[rows]]
