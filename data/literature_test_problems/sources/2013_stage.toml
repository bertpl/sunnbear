f = 'cos(x) - x^3'
name = 'Function From Zhang'
interval = '`[0, 4]` (Figure 1); `[-10, 10]` (Figure 2)'
also_in = 'Zhang (2011)'
notes = "Stage says `(0,4)` corresponds to Zhang, and that its code reproduces Zhang's Table 1."

