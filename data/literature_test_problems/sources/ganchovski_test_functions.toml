title = 'Ganchovski (2026): Root-finding Test Functions, revision of 2026-09-29'
reference = '''
Ganchovski, N. (2026). Root-finding Test Functions. The file `Test functions.pdf` in the repository https://github.com/Proektsoft-EOOD/ModAB-Root-Finding at commit `b3309e9a5177d6305ac84deba6537adb9b878c5e`: https://raw.githubusercontent.com/Proektsoft-EOOD/ModAB-Root-Finding/b3309e9a5177d6305ac84deba6537adb9b878c5e/Test%20functions.pdf.
- The PDF prints no author or date: its metadata give 2026-09-29 as its creation date. The repository's README puts it under the MIT License of `C/LICENSE`, which names Ned Ganchovski as the copyright holder.
- An earlier version was posted on ResearchGate in 2023 as "Additional test functions", https://www.researchgate.net/publication/373922895_Additional_test_functions; roots-fortran (`roots_fortran`) cites that version.
'''
year = 2026
home = '1.3'
where_in_source = '''
17 pages that hold 101 functions, f01–f101, in a grid of 2 columns.
- Each cell gives the function, a plot of it on its interval, and a root line in the notation of Calcpad, `x_nn = $Root{f_nn(x) = 0; x ∈ [a; b]} = r`, with the root `r` to about 3 significant digits. The interval of each row is the one in its root line, except f31's, whose root line is garbled (see its note).
- The root lines of 9 functions use `$Find{f_nn(x); x ∈ [a; b]}` in place of `$Root`: f36, f38, f39, f40, f76, f77, f78, f79 and f101.
- The cells name f63–f101; f01–f62 have no names.
- A heading above each block of cells names the block's origin. The headings name the same references as the article of Ganchovski et al. (2026) (`2026_ganchovski_et_al`) for its blocks, except that Oliveira & Takahashi's heading gives no year or venue, and f31–f32 sit under the heading "My functions".
'''
transcribed_from = '''
the PDF's page images, checked against its text layer.
- The PDF is the same file (same MD5) as `Test functions.pdf` at commit `0d6efd5` of the authors' earlier repository, https://github.com/Just-A-Random-Geek/ModAB-Root-Finding.
- Its text for f01–f92 equals, apart from layout, the text of the article's supplementary `Test Functions.pdf` (folder `MDPI-Algorithms-Data/` at that commit, created 2026-04-12), which ends at f92.
'''
rows_summary = '101, 1 per function.'
notes = '''
How to read the rows:
- **`log` is the natural log**, printed `ln`. **`exp(u)`** writes both the PDF's `exp(u)` and its `e^u`; `e` alone (f68, f100) is Euler's number.
- **`if(c; a; b)`** writes the PDF's case brace "if c: a, else: b": `a` where `c` holds, `b` otherwise. `==` and `!=` write the PDF's `≡` and `≠`.
- **`cbrt` is the real cube root**, printed as a radical with index 3 (f70, f100). `abs(u)` writes `|u|`; `ceiling`, `floor`, `sign` and `atan` are as printed.
- **`also_in`** gives the heading of each block, with the short labels of `2026_ganchovski_et_al`, such as Galdino (2011). f31–f32 sit under "My functions", so they have no `also_in`. The heading "SciML Benchmarks test suite" sits above the row of cells that holds f83 and f84, and no heading follows it; `also_in` gives it for f83–f100, and is empty for f101, whose name credits L. Tomov.
- **Roots** are left out, except where a note needs one.
'''

[[relations]]
sources = ['2026_tomov_ganchovski_benchmark']
text = '''
The rows of Tomov & Ganchovski's benchmark (`2026_tomov_ganchovski_benchmark`) come from its C# code at commit `0d6efd5`. Its f01–f101 are the f01–f101 of this PDF, and its rows take the names of f63–f101 from this PDF. Apart from notation, 92 rows have the same function and interval in both; these 9 differ:
- **f27, f28:** the code has `p(x) = x + 1.11111` and `sin((x - 7.143)^3)`; this PDF prints `1.11` and `7.14`.
- **f29, f42, f92:** the code's intervals are `[2.6, 4.6]`, `[0, pi]` and `[-10, 10]`; this PDF prints `[2.6, 3.6]`, `[0, 4]` and `[-0, 10]`.
- **f76:** the code returns `(1 + 1e6)/1e6` above the step and -1 below it; here the `- 1` follows the whole `if`, so the value above the step is `10^-6`.
- **f81:** the code has `if(x > -1; 1 + sin(1/(x + 1)); 0 - 1)`, which touches 0 without a sign change, and the benchmark leaves it out of its statistics; here the first branch is `1 + sin(1/(x + 1)) - 1`, which changes sign at the printed root -0.682, and the else branch is 0.
- **f82, f83:** inside `floor`, the code divides by `2e-2`; this PDF divides by 2 and multiplies by `10^-2`.
'''

[[relations]]
sources = ['2026_ganchovski_et_al']
text = "The f01–f92 of Ganchovski et al. (2026) (`2026_ganchovski_et_al`), from the article's Table 2, are the f01–f92 of this PDF, and 82 rows have the same function and interval in both. The 9 rows that differ from Tomov & Ganchovski's benchmark (`2026_tomov_ganchovski_benchmark`) differ from the article's rows in the same way; the f28 row of `2026_ganchovski_et_al` follows the code, because the article prints `sin(x - 7.143)^3)`, with an unmatched parenthesis. **f02** differs too: its last term is `sqrt(3)/18` here and `sqrt(x)/18` in the article."

[[relations]]
sources = ['roots_fortran']
text = '''
The cases 146–157 of roots-fortran (`roots_fortran`), whose comment cites Galdino (2011) and the 2023 version of this PDF, are 10 functions of this PDF: 146 = f01, 147 = f02, 148 = f04, 149 = f28, 150 = f29, 151 = f30, 152 = f31, 153 = f32, 154 = f41 and 155–157 = f42.
- Where this PDF differs from the C# code, the cases follow this PDF: f28's `7.14` and f29's `[2.6, 3.6]`.
- **Case 146** starts its bracket at 0.51, where f01 starts at 0.5; the case's comment says that roots-fortran moved it, so that the first midpoint of bisection is not the root.
- **Cases 155–157** replace f42's `[0, 4]` by 1 bracket around each of its roots 1, 2 and 3: `[0, 1.9]`, `[1.001, 2.001]` and `[2.5, 10]`. Whether the 2023 version had these brackets is unknown.
- The comment names Galdino (2011) for all 12 cases, where this PDF puts f31–f32 under "My functions" and f41–f42 under Swift & Lindfield (1978).
'''

