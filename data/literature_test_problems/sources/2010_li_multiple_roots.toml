title = 'Li, Mu, Ma, Hou (2010): fifth-order method for multiple roots'
reference = 'Li, X., Mu, C., Ma, J., Hou, L. (2011). Fifth-order iterative method for finding multiple roots of nonlinear equations. Numerical Algorithms 57(3), 389–398. Published online 30 October 2010. https://doi.org/10.1007/s11075-010-9434-5.'
year = 2010
subcategory = '1.2'
where_in_source = '''
- Section 2, "Numerical results", lists 15 test problems `f01` to `f015` (page 7 of the PDF, which has no journal page numbers), each with its root `x*` and the root's multiplicity `m`.
- Table 1 (page 6 of the PDF) gives the iterations of 6 methods per function from 1 starting point `x0`; the 2 methods that need 2 starting values use `x1 = x0 - 0.1`.
- The article cites no source for its functions.
'''
transcribed_from = "the article's text layer, checked against the page images."
rows_summary = '15, 1 per test problem of Section 2.'
notes = '''
- **Keys:** the article's labels, printed as `f01` to `f09` and `f010` to `f015`.
- **Starting points:** the article gives starting points, not intervals, so no row has an `interval`; each row's `notes` gives the stated root, its multiplicity and the starting point `x0`.
'''

[[relations]]
sources = ['roots_jl']
text = '''
This is the article at the URL of the `## multiplicity` comment that stands above `func13`–`func18` in Roots.jl.
- `func14`, `func15`, `func17` and `func18` are `f02`, `f03`, `f05` and `f06`, with the same expressions; their `alpha` values in the code equal the article's `x*`.
- `func13` is `f01` with `+ 2` in the denominator where `f01` has `+ 1`; both have the root `sqrt(5)`, and `func13`'s `alpha` equals `f01`'s `x*`.
- `func16`, `1e6*(x - 1)^7` written out, is not in the article.
- The starting points differ: Roots.jl spreads 10 over a range per problem, and none of them is the article's `x0`.
- `f04` and `f07`–`f015` are not in Roots.jl's set.
'''

[[rows]]
key = 'f01'
f = '(x - sqrt(5))^4/((x - 1)^2 + 1)'
notes = 'Stated: root `2.236067977499790` of multiplicity 4. `x0 = 4.30`.'

[[rows]]
key = 'f02'
