title = 'roots-fortran (2025): the test problems of `root_tests.f90` at commit 390e7ea'
reference = '''
Williams, J., roots-fortran, file `test/root_tests.f90` at commit `390e7ea` (2025-01-25, the last commit to the file), https://github.com/jacobwilliams/roots-fortran/blob/390e7ea30751fe2ab23ddb876a3563e07bef1b76/test/root_tests.f90, BSD-3-Clause license.

The program's header comment gives 1 reference, without naming cases: Alefeld, G. E., Potra, F. A. and Shi, Y., "Algorithm 748: Enclosing Zeros of Continuous Functions", ACM Trans. Math. Softw. 21(3), September 1995, pp. 327–344 (no DOI in the file).

Comments name these sources for cases or blocks, as they give them:
- "Dowell & Jarratt", with no year (cases 18–24).
- "Gottlieb's paper [table 1 & 2]", with no further detail (cases 30–36). This is Gottlieb & Thompson (2010), whose rows are in `2010_gottlieb`; cases 30–36 are its tests 1–7, unchanged.
- http://www.mth.pdx.edu/~daescu/mth451_551/Muller_bisection.pdf (cases 41, 42). The host is gone, and no web archive captured the file.
- Alefeld–Potra–Shi (1995), as case 11 from "Algorithm 748: Enclosing Zeros of Continuous Functions", with n = 20 (case 45).
- Chandrupatla, T. R., "A new hybrid quadratic/bisection algorithm for finding the zero of a nonlinear function without using derivatives", Advances in Engineering Software 28(3), April 1997, pp. 145–149 (cases 47–62).
- "A modified three-point Secant method with improved rate and characteristics of convergence", July 2019, with no author (cases 63–68). This is Tiruneh (2019), whose rows are in `2019_tiruneh`; cases 63–68 are 6 of the 7 functions of its Table 1. The article gives starting points, not intervals, so the brackets are roots-fortran's own.
- Popovski, D., "A note on King's method F for finding a bracketed root", 1982, https://www.semanticscholar.org/paper/A-note-on-King's-method-F-for-finding-a-bracketed-Popovski/513ffdb3befbf48c38bb70dbec60934472cc9903 (cases 73–98). No file in `sources/` gives the article's rows.
- "Stage paper", with "see also #26" (cases 99–102). This is Stage (2013), whose rows are in `2013_stage`. Case 99 is Stage's §3.5 with `x` replaced by `-x`, case 100 is §3.6 and case 102 is §3.10; case 101 is no Stage function, but Galdino's `g21`–`g23`. "see also #26" points to no Stage function: case 26 is Brent (1971)'s `x*exp(-x^-2)`.
- "P1 in BlendTF paper" (cases 103–117). This is Badr, Almotairi & El Ghamry (2021), whose rows are in `2021_badr`. Cases 103–117 are all 15 of its problems `P1`–`P15`, not only `P1`; the only difference is the interval of `P3`, which is `[3, 4]` in the article and `[3, 7]` in case 105.
- Wikipedia, ITP method, https://en.wikipedia.org/wiki/ITP_method#Example:_Finding_the_root_of_a_polynomial (case 118). Its rows are in `2025_wikipedia_itp_method`, whose function matches case 118.
- "the ITP paper : Table 1" (cases 119–127).
- "Table 1 from RBP paper" (cases 134–144). This is Suhadolnik (2012), whose rows are in `2012_suhadolnik`. Cases 134–137 and 140–144 are the examples 1, 2, 3, 5, 7, 8, 10, 17 and 18 of its Table 1, unchanged; cases 138–139 hold Stage's §3.7, not a Suhadolnik function.
- "Zhang test case" (case 145). This is Zhang (2011), whose rows are in `2011_zhang`; the case's bracket is `[0, 4]`, the interval at which Zhang's Table 1 starts.
- http://sergiogaldino.pbworks.com/w/file/fetch/66011429/0130-1943543, the file of Galdino (2011) (`2011_galdino`), and "Root-test-functions.pdf : https://www.researchgate.net/publication/373922895_Additional_test_functions" (cases 146–157).
  - That PDF is the 2023 version of Ganchovski's "Root-finding Test Functions", whose revision of 2026-09-29 is `ganchovski_test_functions`.
  - Cases 146–157 are its f01, f02, f04, f28–f32, f41 and f42, with f42 split over cases 155–157, and follow the PDF where it differs from the C# code of Tomov & Ganchovski's benchmark (`2026_tomov_ganchovski_benchmark`).
  - The brackets of 4 cases differ: case 146 starts at 0.51, as roots-fortran's own comment explains, and cases 155–157 bracket each root of f42 in place of `[0, 4]`.
'''
year = 2025
subcategory = '1.3'
where_in_source = '''
the subroutine `problems` of the program `root_tests`, a `select case (nprob)` over the cases `nprob = 1, ..., 157` (`num_of_problems = 157`).
- A block such as `case (2:11)` gives 1 function, with 1 bracket per case number.
- A case may set a list `ns` of values of an integer `n`; the driver then runs the case once per value. A case without `ns` runs once.
'''
transcribed_from = '''
the code of the file at commit `390e7ea`: the assignments to `f`, the bounds `a` and `b`, and the lists `ns`. Each case also holds 2 strings for a LaTeX results table, the function (`latex`) and the bracket (`bounds`); where they differ from the code, the rows follow the code (cases 70, 147).
'''
rows_summary = "120, 1 per `case` block, covering the file's 157 numbered cases. With each value of `n` counted, the driver makes 223 runs."
notes = '''
How to read the rows:
- **`key`** holds the case number, or the range of case numbers of a block.
- **`f`** is the code's expression with `**` written as `^` and the `_wp` kind suffix dropped. Helper variables are written out: `dn` and `di` are `n` and `i` converted to real, and `t1`, `emx` and `ex` are replaced by their expressions. `pi` is `acos(-1.0)`. `sign(1.0, y)` is Fortran's 1.0 with the sign of `y`.
- **`parameters`** gives the values of `n` in the case's list `ns`, or constants that the case defines.
- **`interval`** gives the code's `[a, b]`. In a block, each bracket carries its case number.
- **Each case also gives a root**, 1 per value of `n` where it depends on `n`; the rows leave out the roots.
- **`also_in`** holds the source that a comment names, by these rules:
  - a comment that gives a range of cases (`18-24`, `30-36`) applies to that range;
  - a comment inside a case applies to that case, in place of its block's source (case 145);
  - any other comment between cases applies to the cases below it, up to the next such comment. So the comment "P1 in BlendTF paper" above case 103 covers cases 103–117, and the comment "ill-behaved functions" above case 128, which names no source, ends the ITP block at case 127.
  - The program's header reference to Alefeld–Potra–Shi (1995) is not repeated in `also_in`.
- **Commented-out code** holds no rows; `notes` mention it where it holds functions or values of `n`.
'''

