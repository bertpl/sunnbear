notes = "Roots 0.5, -1, 2 and `1 ± 0.5i`. Bairstow's method from `r = s = -1` to `es = 1%` finds the quadratic factor with roots 0.5 and -1, then runs on the quotient `x^3 - 4*x^2 + 5.25*x - 2.5` (Ex. 7.3, which prints the complex pair as `1 ± 0.499i`). Ex. 7.7 finds all roots with MATLAB's `roots`, and divides by `x^2 + 0.5*x - 0.5` with `deconv`."

[[rows]]
key = '§7.7.1, Fig. 7.6; Ex. 7.4; §7.7.3, Fig. 7.7'
f = 'x - cos(x)'
notes = "Root 0.739085. Excel: trial and error after a plot on `[0, 2]` (Fig. 7.6), and Goal Seek (Ex. 7.4); Mathcad's `root` from `x = 1`, with a plot on `[-10, 10]` (Fig. 7.7)."

[[rows]]
key = 'Fig. 7.8'
f = 'x^3 - 10*x + 2'
notes = "Roots -3.257897, 0.20081 and 3.057087, by Mathcad's `polyroots`; plotted on `[-4, 4]`."

[[rows]]
key = '§8.1, (8.3), Table 8.1; Prob. 8.1'
f = '(p + a/v^2)*(v - b) - R*T'
name = 'van der Waals equation'
parameters = '`R = 0.082054` L atm/(mol K); carbon dioxide `a = 3.592`, `b = 0.04267`; oxygen `a = 1.360`, `b = 0.03183`; `p = 1, 10, 100` atm and `T = 300, 500, 700` K (§8.1); ethyl alcohol `a = 12.02`, `b = 0.08407`, `T = 375` K, `p = 2.0` atm (Prob. 8.1)'
notes = 'Unknown `v`, the molal volume (L/mol) of a gas; the book prints the derivative (8.4). Newton from the ideal-gas volume `R*T/p`: for carbon dioxide at 300 K and 1 atm, from 24.6162 to 24.5126 in 2 iterations; Table 8.1 lists the 18 results.'

[[rows]]
key = '§8.2, (8.14)'
f = 'K1/(10^6*H)*KH*pCO2 + 2*K2*K1/(10^6*H^2)*KH*pCO2 + Kw/H - H'
name = 'pH of rainwater'
parameters = '`KH = 10^-1.46`, `K1 = 10^-6.3`, `K2 = 10^-10.3`, `Kw = 10^-14`; `pCO2 = 315, 375` ppm (1958, 2003)'
interval = '`[1E-12, 1E-2]` (the pH from 2 to 12)'
notes = 'Unknown `H`, the hydrogen-ion concentration `[H+]`, which gives the pH `-log10(H)` of rainwater; the book derives (8.14) from 5 equilibrium equations, and calls it a cubic in `[H+]`. Bisection on the pH, from the initial guesses 2 and 12, which the interval gives as values of `H`: 11 iterations, for an absolute error of 0.005, give 5.6279 for 1958, and 35 give 5.6304; 2003 gives 5.59.'

[[rows]]
key = '§8.3, (8.19), (8.20), Fig. 8.4'
f = 'exp(-R*t/(2*L))*cos(sqrt(1/(L*C) - (R/(2*L))^2)*t) - q/q0'
name = 'charge on the capacitor of an RLC circuit, unknown resistance'
parameters = '`L = 5` H, `C = 10^-4` F, `t = 0.05` s, `q/q0 = 0.01`'
interval = '[0, 400]'
notes = "Unknown `R`, the resistance (ohm) at which the capacitor's charge decays to 1% of its initial value in 0.05 s. Printed with the values as (8.20), `exp(-0.005*R)*cos(sqrt(2000 - 0.01*R^2)*0.05) - 0.01`, which needs `2000 - 0.01*R^2 > 0`. 21 bisection iterations give `R = 328.1515`."

[[rows]]
key = '§8.4, (8.21), Fig. 8.5; Prob. 8.13'
f = '1/sqrt(f) + 2.0*log10(eps/(3.7*D) + 2.51/(Re*sqrt(f)))'
name = 'Colebrook equation'
parameters = "`Re = rho*V*D/mu`; `rho = 1.23` kg/m^3, `mu = 1.79E-5` N s/m^2, `D = 0.005` m, `V = 40` m/s, `eps = 1.5E-6` m (the book's 0.0015 mm), so `Re = 13743` (§8.4, Prob. 8.13(a)); `eps = 4.5E-5` m (the book's 0.045 mm, Prob. 8.13(b))"
interval = '[0.008, 0.08]'
notes = "Unknown `f`, the friction factor of turbulent flow in a pipe of roughness `eps` and diameter `D`. The book prints `log`, a base-10 log as its MATLAB code shows; Prob. 8.13 prints `1/sqrt(f) = -2.0*log(...)`. Root `0.0289678`. Bisection takes 22 iterations and false position 26. Newton converges from 0.008 in 6 iterations, diverges from 0.08 (it converges only from below about 0.066), and converges in 3 from the Swamee–Jain estimate (8.22), 0.029031. MATLAB's `fzero` fails from 0.008, where it meets a complex value, and works from above about 0.016. Prob. 8.13 suggests the Blasius estimate `0.316/Re^0.25` as the initial guess."

[[rows]]
key = '§8.4, (8.23), Fig. 8.6'
f = 'f = 0.25/(log10(eps/(3.7*D) + 2.51/(Re*sqrt(f))))^2'
name = 'Colebrook equation, fixed-point form'
parameters = "as in §8.4's Colebrook row"
interval = '[0.008, 0.08]'
notes = '(8.21) solved for its first `f`; the book prints `log`, base 10. Fixed-point iteration from any guess in the interval reaches an error below 0.008% in 6 or fewer iterations.'

