title = 'Chapra, Canale (2015): Numerical Methods for Engineers, Part Two'
reference = 'Chapra, S. C., Canale, R. P. (2015). Numerical Methods for Engineers, 7th edition. McGraw-Hill Education. ISBN 978-0-07-339792-4. The 8th edition appeared in 2021; the rows follow the 7th.'
year = 2015
subcategory = '1.4'
where_in_source = '''
Part Two, "Roots of Equations" (pp. 117–228), with the examples, figures and end-of-chapter problems of its parts:
- the introduction PT2.1–PT2.3 (pp. 117–122);
- chapter 5, "Bracketing Methods" (pp. 123–144);
- chapter 6, "Open Methods" (pp. 145–175);
- chapter 7, "Roots of Polynomials" (pp. 176–203);
- chapter 8, "Case Studies: Roots of Equations" (pp. 204–225).

The epilogue (pp. 226–228) holds no function.
- The rows leave out:
  - the general forms that name no concrete function: (PT2.5), (PT2.6), (7.1), (7.29), the ODEs (7.2)–(7.6), and `u(x) = f(x)/f'(x)` (6.13);
  - figures that sketch a function without its expression: Figures 5.2, 5.3(b), 5.16, 6.1, 6.3, 6.6, 6.13(c) (a quadruple root) and 7.3;
  - formulas that are evaluated, not solved: Ex. 6.9's inverse parabola `g(y) = 0.5*y^2 - 2.5*y + 4` (printed with `x` for `y`), §8.2's trend of `pCO2`, the Swamee–Jain formula (8.22), Prob. 8.13's pressure drop and Prob. 8.48's Stokes-law velocity (P8.48.2);
  - systems of nonlinear equations: §6.6 ((6.19), Ex. 6.11, 6.12), Ex. 7.5, Figure 7.9, §8.2's system (8.6)–(8.10) before it is reduced to (8.14), and Prob. 6.22–6.24, 6.31, 6.32, 7.12, 7.13, 7.18, 8.6 and 8.43–8.46;
  - problems that leave the reader to derive the function of the unknown: Prob. 5.20 (a floating frustum of a cone: the book prints the frustum's volume, but not the radius at the waterline as a function of the unknown height), 8.41 (the energy balance of a mixer, from 2 printed heat capacities) and 8.47 (the moment on the space shuttle at liftoff, from Figure P8.47);
  - Prob. 7.16, which runs Müller's method through 3 data points, without a function.
- Every problem that names a method without a function repeats an example or another problem (5.21–5.26, 6.27–6.30, 7.6–7.9, 7.15, 7.20–7.24); its key is in that function's row.
'''
transcribed_from = '''
the book's PDF, whose page number is the book's plus 17.

All of Part Two was read from the page images; the problems' coefficients were checked against the text layer, which encodes some symbols as other characters (`5` for `=`, `2` for a minus sign, `1` for `+`), so the rows follow the page images where the 2 differ.
'''
rows_summary = '118, 1 per distinct function of the unknown: a function that several examples or problems use is 1 row whose key lists them all. 30 rows come from the introduction, the text, its examples, figures and case studies; 88 come from the problems alone.'
notes = '''
How to read the rows:
- **Keys:** `(PT2.n)` and `(n.m)` are the book's equation numbers; `§` is a passage of the text, with its page; `Ex.`, `Fig.` and `Prob.` are the book's Examples, Figures and end-of-chapter Problems, with a part letter where a problem has several functions.
- **Equations:** an equation that the book prints as `lhs = rhs` stays in that form; `f(x) = 0` and `0 = f(x)` are written as `f(x)`. A fixed-point form `x = g(x)` is its own row. The parachutist's equation and the circuit's equation are 2 rows each, 1 per unknown (`c` or `m`; `R` or `L`), because they are different functions of the unknown.
- **Notation:**
  - the book writes `ln` for the natural log, which the rows write `log`, and `log` for the base-10 log of the Colebrook equation, which the rows write `log10`; `cos^-1` becomes `arccos`;
  - subscripts join their names: `Pu,max` becomes `Pu_max`, `c_a,0` becomes `ca0`, `[H+]` becomes `H`, `[HCO3-]` becomes `HCO3`;
  - a number printed as `1.671 × 10^-4` is written `1.671E-4`;
  - `<x - a>^n` is a singularity function, as Prob. 8.24 defines it: `(x - a)^n` for `x > a`, else 0.
- **Intervals:** the initial guesses `xl` and `xu` of a bracketing method are written as the interval `[xl, xu]`; the starting points of the open methods are in `notes`.

Differences from the 6th edition (2010):
- **Text:** of the functions of the 30 rows from the text, only the parachutist's changed, and the van der Waals row's through its Prob. 8.1.
- **Numbering:** problems were renumbered mainly among the program problems of chapters 5 and 6, in chapter 6 from 6.14 on, and in chapter 8 at 8.3–8.6, 8.11–8.13 and from 8.28 on. The keys of the rows are the 7th's numbers.
- **Changed functions** (36 rows; the 6th's form in parentheses):
  - parachutist, unknown `c`: Ex. 5.1 takes `g = 9.81`, so (E5.1.1) is `(668.06/c)*(1 - exp(-0.146843*c)) - 40`, root 14.8011 (6th: `g = 9.8`, `667.38/c`, root 14.7802); Prob. 5.14 takes `m = 82` on `[3, 5]`, which holds the root (6th: `m = 80` on `[0.1, 0.2]`, which did not);
  - parachutist, unknown `m`: `g = 9.81` in both problems (6th: `9.8`); Prob. 5.13 has `v = 36`, `t = 10` (6th: `v = 35`, `t = 9`), and Prob. 7.11 has `c = 15` (6th: `c = 14`);
  - van der Waals, Prob. 8.1: ethyl alcohol, `a = 12.02`, `b = 0.08407`, `T = 375` K, `p = 2.0` atm (6th: acetone, `a = 14.09`, `b = 0.0994`, `T = 400` K, `p = 2.5` atm);
  - Prob. 5.1: `-0.5*x^2 + 2.5*x + 4.5` (6th: `-0.6*x^2 + 2.4*x + 5.5`);
  - Prob. 5.2: `5*x^3 - 5*x^2 + 6*x - 2` (6th: `4*x^3 - 6*x^2 + 7*x - 2.3`);
  - Prob. 5.3: `-25 + 82*x - 90*x^2 + 44*x^3 - 8*x^4 + 0.7*x^5` (6th: `-26 + 85*x - 91*x^2 + 44*x^3 - 8*x^4 + x^5`);
  - Prob. 5.4: `-12 - 21*x + 18*x^2 - 2.75*x^3` (6th: `-13 - 20*x + 19*x^2 - 3*x^3`);
  - Prob. 5.5: `sin(x) = x^2` (6th: `sin(x) = x^3`);
  - Prob. 5.6: `log(x^2) = 0.7` (6th: `log(x^4) = 0.7`);
  - Prob. 6.1: `sin(sqrt(x)) - x`, to `es <= 0.01%` (6th: `2*sin(sqrt(x)) - x`, to `0.001%`);
  - Prob. 6.3: `-0.9*x^2 + 1.7*x + 2.5`, to `es = 0.01%` (6th: `-x^2 + 1.8*x + 2.5`, to `0.05%`);
  - Prob. 6.9: `x^3 - 6*x^2 + 11*x - 6.1` (6th: `0.95*x^3 - 5.9*x^2 + 10.9*x - 6`);
  - Prob. 6.10: `7*sin(x)*exp(-x) - 1` (6th: `8*sin(x)*exp(-x) - 1`);
  - Prob. 7.1: `x^4 - 7.5*x^3 + 14.5*x^2 + 3*x - 20` (6th: `x^4 - 5*x^3 + 5*x^2 + 5*x - 6`);
  - Prob. 7.2: `x^5 - 5*x^4 + x^3 - 6*x^2 - 7*x + 10` (6th: `x^5 - 6*x^4 + x^3 - 7*x^2 - 7*x + 12`);
  - Prob. 7.14: `(x + 2)*(x + 5)*(x - 6)*(x - 4)*(x - 8)` (6th: `(x - 6)*(x + 2)*(x - 1)*(x + 4)*(x - 8)`);
  - Prob. 7.19, numerator: `s^3 + 9*s^2 + 26*s + 24` (6th: `s^3 + 12.5*s^2 + 50.5*s + 66`);
  - Prob. 7.19, denominator: `s^4 + 15*s^3 + 77*s^2 + 153*s + 90` (6th: `s^4 + 19*s^3 + 122*s^2 + 296*s + 192`);
  - recycle rate, Prob. 8.2: `XAf = 0.9` (6th: `0.96`);
  - dissociation of water vapor, Prob. 8.3: `pt = 3` atm, `K = 0.05` (6th: Prob. 8.5, `pt = 3.5`, `K = 0.04`);
  - chemical equilibrium, Prob. 8.5 only: `K = 0.015`, `cb0 = 30` (6th: Prob. 5.19 and 8.3, `K = 0.016`, `cb0 = 28`);
  - the 2 fixed-point forms of the spherical tank, Prob. 8.10: `V = 0.5` m^3 (6th: `V = 0.75`);
  - enzymatic plug flow reactor, Prob. 8.11: `V = 100` L, `F = 80` L/s, `Cin = 0.2` M, `kmax = 1E-2` 1/s (6th: Prob. 8.13, `V = 500`, `F = 40`, `Cin = 0.5`, `kmax = 5E-3`);
  - secant formula for a column, Prob. 8.14: `e*c/k^2 = 0.2`, `L/k = 100` (6th: `0.4`, `50`);
  - oxygen downstream of a sewage discharge, Prob. 8.15: `c = 10 - 20*(exp(-0.2*x) - exp(-0.75*x))` (6th: `exp(-0.15*x) - exp(-0.5*x)` in the parentheses);
  - bacteria in a lake, Prob. 8.16: `c = 70*exp(-1.5*t) + 25*exp(-0.075*t)` with `c = 9`, Newton from `t = 10` (6th: `75*exp(-1.5*t) + 20*exp(-0.075*t)` with `c = 15`, from `t = 6`);
  - catenary cable, Prob. 8.17: `w = 10`, `y0 = 5` (6th: `w = 12`, `y0 = 6`);
  - elastic curve of a beam, Prob. 8.18 only: `L = 450` cm, `w0 = 1.75` kN/cm (6th: Prob. 5.20 and 8.18, `L = 600`, `w0 = 2.5`);
  - damped oscillation, Prob. 8.19: `y = 8*exp(-k*t)*cos(omega*t)`, `k = 0.5`, `omega = 3`, `y = 4` (6th: factor 9, `k = 0.7`, `omega = 4`, `y = 3.5`);
  - present worth, Prob. 8.22 only: `P = 20000`, `A = 4000` (6th: Prob. 5.21 and 8.22, `P = 25000`, `A = 5500`);
  - oscillating current, Prob. 8.30: `i = 9*exp(-t)*sin(2*pi*t)`, its lowest root (6th: Prob. 8.29, `cos` for `sin`, every root);
  - resistivity of doped silicon, Prob. 8.31: `mu0 = 1300`, `q = 1.6E-19`, `rho = 6E6` (6th: Prob. 8.30, `1350`, `1.7E-19`, `6.5E6`);
  - thrown ball, Prob. 8.37: `x = 40` m, `y0 = 1.8` m (6th: Prob. 8.36, `x = 35`, `y0 = 2`);
  - rocket, Prob. 8.39: `u = 2200`, `m0 = 160000`, `q = 2680`, `v = 1000` (6th: Prob. 8.38, `2000`, `150000`, `2700`, `750`);
  - phase angle of a car's vibration, Prob. 8.40: `phi = omega/2 - 1` (6th: Prob. 8.39, `omega/3 - 1`).
- **Functions new in the 7th** (5 rows):
  - Prob. 5.15, water discharged from a tank through a pipe;
  - Prob. 6.14, a quintic;
  - Prob. 8.28, §8.2's pH with a lake's alkalinity;
  - Prob. 8.29, §8.3's circuit with the inductance as unknown;
  - Prob. 8.48, the settling velocity of a particle.
- **A new use of a function:** Prob. 5.19, a floating sphere, is a new use of the spherical-tank row's function.
- **Functions of the 6th that the 7th no longer has** (3):
  - Prob. 5.12: `-2*x^6 - 1.6*x^4 + 12*x + 1`, its maximum on `[0, 1]` by bisection to `es = 5%`, a root of `f'(x)`; the 7th's Prob. 5.12 takes Prob. 6.12's function;
  - Prob. 6.5: `-2 + 6*x - 4*x^2 + 0.5*x^3`, Newton from `x0 = 4.2` and from `x0 = 4.43`; the 7th's Prob. 6.5 takes Prob. 6.4's function;
  - Prob. 8.28: §8.3's circuit with the capacitance `C` as unknown, `exp(-R*t/(2*L))*cos(sqrt(1/(L*C) - (R/(2*L))^2)*t) - q/q0` with `R = 280` ohm, `L = 7.5` H, `t = 0.05` s, `q/q0 = 0.01`; the 7th's Prob. 8.29 makes `L` the unknown.
- **Problems that the rows leave out:** the 7th no longer has the 6th's Prob. 5.15 (the moment of a beam, read from a figure), and it adds Prob. 5.20.

Other sources with the same function:
- `log(x)` on `[0.5, 5]` (Ex. 6.7) is Suhadolnik (2012)'s example 1 (`2012_suhadolnik`), and is in Chen & Li (2006) (`2006_chen_li`), Ganchovski et al.'s f51 (`2026_ganchovski_et_al`) and roots-fortran's case 134 (`roots_fortran`).
- `exp(-x) - x` is Bradie's 2.1-1(c) (`2006_bradie`), on `(0, 1)`, and Alhseno's 22 (`2026_alhseno`); `x = exp(-x)` is in Bradie (Ex. 2.6) and Epperson (3.1-5) (`2013_epperson`).
- `x - cos(x)` is Badr's `P8` (`2021_badr`), Sabharwal's `T2.9` (`2019_sabharwal`) and Ellithy's 4 (`2026_ellithy`), all on `[0, 1]`.
- `(x - 3)*(x - 1)*(x - 1)` (6.11) is Alhseno's 19, `(x - 1)^2*(x - 3)`.
'''

