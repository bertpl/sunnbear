notes = "Root `0.56714329`. §PT2.1.1 names it as a function without an analytical root. Ex. 6.2 plots `y1 = x` and `y2 = exp(-x)` and reads the root at their intersection (Fig. 6.2(b)). Newton from `x0 = 0` (Ex. 6.3, 6.4); secant from `x(-1) = 0`, `x0 = 1` (Ex. 6.6); modified secant from `x0 = 1` with `delta = 0.01` (Ex. 6.8). Fig. 6.9 compares the methods' errors on it; the problems repeat the examples with the reader's programs."

