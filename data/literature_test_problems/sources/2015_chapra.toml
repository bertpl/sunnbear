sources = ['2021_badr', 'roots_fortran', '2026_ellithy']
text = '''
Badr et al. (2021) (`2021_badr`) cite this edition for 2 of their 15 problems, both as this edition prints them:
- **`P11`**, `x^10 - 1` on `[0, 1.3]`, is Ex. 5.6. roots-fortran's case 113 (`roots_fortran`) copies it from Badr, and Ellithy (2026)'s 12 (`2026_ellithy`) has it too.
- **`P15`**, `sin(x) - x^2` on `[0.5, 1]`, is Prob. 5.5, `sin(x) = x^2` on the same interval. roots-fortran's case 117 copies it from Badr, and Ellithy's 6 has it too.
'''

[[relations]]
sources = ['2006_bradie']
text = '''
Bradie (2006) (`2006_bradie`) has 4 of the book's applied equations, with other notation or constants:
- **van der Waals:** Bradie writes it for `n` moles of chlorine; §8.1 writes it per mole (`v = V/n`), for carbon dioxide and oxygen, and Prob. 8.1 for ethyl alcohol.
- **Redlich–Kwong** (Bradie 2.4-15): per mole, with `a = 0.42747*R^2*Tc^(5/2)/Pc`, `b = 0.08664*R*Tc/Pc` and `R = 0.08206`; Prob. 8.7 writes it per kg, with the factors `0.427` and `0.0866` and `R = 0.518` kJ/(kg K), for methane.
- **Liquid in a horizontal cylinder** (Bradie 2.2-13): the same expression, with `r = 1` m, `L = 3` m, `V = 7` m^3; Prob. 8.8 has `r = 2`, `L = 5`, `V = 8`.
- **Bradie's depth of submersion** (§2.2) is the spherical tank's cubic in `h`: it sets the spherical cap's volume `pi*h^2*(3*R - h)/3` equal to `(4/3)*pi*R^3*rho_o/rho_f`. Prob. 5.19 floats a sphere too, but its `h` is the height above water, so its cap is the part above water, of volume `(4/3)*pi*r^3*(1 - rho_s/rho_w)`.
'''

[[relations]]
sources = ['2026_ellithy']
text = '''
Ellithy (2026) (`2026_ellithy`) holds 3 more of the book's functions, besides its 12 and 6, which it shares with Badr et al. (2021), and its 4, `x - cos(x)`:
- its 43 is the only other Colebrook equation among the sources of this survey: it has `Re = 10^7` and `eps/D = 10^-4` on `[0.008, 0.03]`, and is the negative of (8.21); §8.4 has `Re = 13743` and `eps/D = 0.0003` on `[0.008, 0.08]`;
- its 45 is §8.1's van der Waals equation for carbon dioxide at `p = 10` atm and `T = 300` K, with `R = 0.08206` where §8.1 has `0.082054`, on `[2, 3]`;
- its 23 is Prob. 6.3's `-0.9*x^2 + 1.7*x + 2.5`, on `[2.8, 3.0]`; Prob. 6.3 gives no interval and starts from `x0 = 5`.
'''

