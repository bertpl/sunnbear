name = 'volume of liquid in a horizontal cylinder'
parameters = '`r = 2` m, `L = 5` m, `V = 8` m^3'
notes = 'Unknown `h`, the depth of the liquid. The book gives `arccos(x) = pi/2 - arctan(x/sqrt(1 - x^2))` for software without an arc cosine.'

[[rows]]
key = 'Prob. 8.10'
f = 'h = sqrt((h^3 + 3*V/pi)/(3*r))'
name = 'volume of water in a spherical tank, fixed-point form'
parameters = '`r = 1` m, `V = 0.5` m^3'
notes = '1 of 2 fixed-point forms of the spherical-tank equation (Prob. 8.9). The problem asks whether each form is stable, and for which initial guesses.'

[[rows]]
key = 'Prob. 8.10'
f = 'h = (3*(r*h^2 - V/pi))^(1/3)'
name = 'volume of water in a spherical tank, fixed-point form'
parameters = '`r = 1` m, `V = 0.5` m^3'
notes = 'The other fixed-point form of Prob. 8.10, printed as a cube root.'

[[rows]]
key = 'Prob. 8.11'
f = 'V/F = -int_Cin^Cout (K/(kmax*C) + 1/kmax) dC'
name = 'enzymatic plug flow reactor'
parameters = '`V = 100` L, `F = 80` L/s, `Cin = 0.2` M, `kmax = 1E-2` 1/s, `K = 0.1` M'
notes = 'Unknown `Cout`, the outlet concentration of a constant-density reactor. The integral is `(K/kmax)*log(Cin/Cout) + (Cin - Cout)/kmax`.'

[[rows]]
key = 'Prob. 8.12'
f = '(dP*rho/G0^2)*(Dp/L)*(eps^3/(1 - eps)) = 150*(1 - eps)/(Dp*G0/mu) + 1.75'
name = 'Ergun equation'
parameters = '`Dp*G0/mu = 1000`, `dP*rho*Dp/(G0^2*L) = 10`'
notes = 'Unknown `eps`, the void fraction of a packed bed; `dP` is the pressure drop, `G0` the mass velocity and `Dp` the particle diameter.'

[[rows]]
key = 'Prob. 8.14'
f = 'P/A = sigma_m/(1 + (e*c/k^2)*sec(0.5*sqrt(P/(E*A))*(L/k)))'
name = 'secant formula for a column'
parameters = '`E = 200000` MPa, `e*c/k^2 = 0.2`, `sigma_m = 250` MPa, `L/k = 100`'
notes = 'Unknown `P/A`, the force per unit area that causes the maximum stress `sigma_m` in a steel beam of slenderness ratio `L/k`; `e*c/k^2` is the eccentricity ratio, and `sec(x) = 1/cos(x)`.'

[[rows]]
key = 'Prob. 8.15'
f = 'c = 10 - 20*(exp(-0.2*x) - exp(-0.75*x))'
name = 'oxygen level downstream of a sewage discharge'
parameters = '`c = 5` mg/L (a)'
interval = '`[0, 2]` (a)'
notes = "Unknown `x`, the distance (km) downstream: (a) where `c` first falls to 5, to 1% error, which the book's hint places within 2 km; (b) where `c` is minimal, a root of `dc/dx`."

[[rows]]
key = 'Prob. 8.16'
f = 'c = 70*exp(-1.5*t) + 25*exp(-0.075*t)'
name = 'bacteria concentration in a lake'
parameters = 'c = 9'
notes = 'Unknown `t`, when the concentration falls to 9: graphically, and by Newton from `t = 10` to `es = 0.5%`.'

[[rows]]
key = 'Prob. 8.17'
f = 'y = (TA/w)*cosh((w/TA)*x) + y0 - TA/w'
name = 'catenary cable'
parameters = '`w = 10`, `y0 = 5`; `y = 15` at `x = 50`'
notes = 'Unknown `TA`, the tension at the end A, the lowest point of the section of Fig. P8.17, of a cable that hangs under its own weight `w` per unit length; the book gives `cosh(x) = (exp(x) + exp(-x))/2`.'

[[rows]]
key = 'Prob. 8.18'
f = 'y = (w0/(120*E*I*L))*(-x^5 + 2*L^2*x^3 - L^4*x)'
name = 'elastic curve of a beam'
parameters = '`L = 450` cm, `E = 50000` kN/cm^2, `I = 30000` cm^4, `w0 = 1.75` kN/cm'
notes = '(P8.18.1), the deflection of a uniform beam under a linearly increasing load. The point of maximum deflection by bisection, a root of `dy/dx`, then the deflection there.'

[[rows]]
key = 'Prob. 8.19'
f = 'y = 8*exp(-k*t)*cos(omega*t)'
name = 'damped oscillation of a structure'
parameters = '`k = 0.5`, `omega = 3`, `y = 4`'
notes = 'Unknown `t`, when the displacement decreases to 4: graphically, then by Newton and secant to `es = 0.01%`.'

[[rows]]
key = 'Prob. 8.21'
f = 'h = h0*(sin(2*pi*x/lambda)*cos(2*pi*t*v/lambda) + exp(-x))'
name = 'reflected standing wave in a harbor'
parameters = '`lambda = 16`, `t = 12`, `v = 48`, `h = 0.4*h0`'
notes = 'Unknown `x`, its lowest positive value.'

[[rows]]
key = 'Prob. 8.22'
f = 'A = P*i*(1 + i)^n/((1 + i)^n - 1)'
name = 'present worth and annual payments'
parameters = '`P = 20000`, `A = 4000`, `n = 6`'
notes = 'Unknown `i`, the interest rate on equipment of $20,000 bought for nothing down and 6 annual payments of $4,000.'

[[rows]]
key = 'Prob. 8.23'
f = 'Ps_max/(1 + (Ps_max/P0 - 1)*exp(-ks*t)) = 1.2*(Pu_max*exp(-ku*t) + Pu_min)'
name = 'urban and suburban populations'
parameters = '`Pu_max = 75000`, `ku = 0.045`/yr, `Pu_min = 100000`, `Ps_max = 300000`, `P0 = 10000`, `ks = 0.08`/yr'
notes = 'Unknown `t` (yr), when the suburban population `Ps(t)` is 20% larger than the urban population `Pu(t)`. The book prints `Pu(t) = Pu_max*exp(-ku*t) + Pu_min` and `Ps(t) = Ps_max/(1 + (Ps_max/P0 - 1)*exp(-ks*t))`, and states the condition in words. Graphically, by false position and by the modified secant method.'

[[rows]]
key = 'Prob. 8.24'
f = '20*(<x - 0>^1 - <x - 5>^1) - 15*<x - 8>^0 - 57'
name = 'shear along a beam'
notes = '`V(x)` of the simply supported beam of Fig. P8.24, with singularity functions; the point(s) where the shear is 0.'

[[rows]]
key = 'Prob. 8.25'
f = '-10*(<x - 0>^2 - <x - 5>^2) + 15*<x - 8>^1 + 150*<x - 7>^0 + 57*x'
name = 'moment along a beam'
notes = '`M(x)` of the beam of Prob. 8.24; the point(s) where the moment is 0.'

[[rows]]
key = 'Prob. 8.26, 8.27(b)'
f = '(-10/3)*(<x - 0>^3 - <x - 5>^3) + (15/2)*<x - 8>^2 + 150*<x - 7>^1 + (57/2)*x^2 - 238.25'
name = 'slope along a beam'
notes = '`du_y/dx(x)` of the beam of Prob. 8.24; the point(s) where the slope is 0. 8.27(b) asks how a root-location method finds the minimum displacement, a root of this slope.'

[[rows]]
key = 'Prob. 8.27(a)'
f = '(-5/6)*(<x - 0>^4 - <x - 5>^4) + (15/6)*<x - 8>^3 + 75*<x - 7>^2 + (57/6)*x^3 - 238.25*x'
name = 'displacement along a beam'
notes = '`u_y(x)` of the beam of Prob. 8.24; the point(s) where the displacement is 0.'

[[rows]]
key = 'Prob. 8.28'
f = 'Alk + H = HCO3 + 2*CO3 + OH'
name = 'pH of a lake with alkalinity'
parameters = '`HCO3 = K1/(10^6*H)*KH*pCO2` (8.11), `CO3 = K2*K1/(10^6*H^2)*KH*pCO2` (8.13), `OH = Kw/H` (8.8); `KH`, `K1`, `K2`, `Kw` as in §8.2; `Alk = 0.4E-3` eq/L (Lake Superior); `pCO2` of 2008, not given'
interval = '`[1E-12, 1E-2]` (the pH from 2 to 12, as in §8.2)'
notes = "(P8.28). Unknown `H`, the hydrogen-ion concentration of Lake Superior in 2008. (P8.28) is §8.2's charge balance (8.10) with the alkalinity `Alk` added, and the problem asks to repeat §8.2's computation, a bisection on the pH in `[2, 12]`, with it; the resulting function, (8.14) minus `Alk`, is not printed. The problem gives no `pCO2` for 2008; §8.2's quadratic trend gives about 385 ppm for that year."

[[rows]]
key = 'Prob. 8.29'
f = 'exp(-R*t/(2*L))*cos(sqrt(1/(L*C) - (R/(2*L))^2)*t) - q/q0'
name = 'charge on the capacitor of an RLC circuit, unknown inductance'
parameters = '`R = 280` ohm, `C = 1E-4` F, `t = 0.05` s, `q/q0 = 0.01`'
notes = "Unknown `L`, the inductance (H), in the equation of the §8.3 row: graphically, by bisection, and with Excel's Solver, MATLAB's `fzero` or Mathcad's `root`. The square root is real only for `L > R^2*C/4 = 1.96` H, and the function has 2 roots above that bound, near 2.40 and 7.84; the book states neither."

[[rows]]
key = 'Prob. 8.30'
f = 'i = 9*exp(-t)*sin(2*pi*t)'
name = 'oscillating current'
parameters = 'i = 3.5'
notes = 'Unknown `t` (s): the lowest value at which the current is 3.5.'

[[rows]]
key = 'Prob. 8.31'
f = 'rho = 1/(q*n*mu)'
name = 'resistivity of doped silicon'
parameters = '`n = (1/2)*(N + sqrt(N^2 + 4*ni^2))`, `mu = mu0*(T/T0)^-2.42`; `T0 = 300` K, `T = 1000` K, `mu0 = 1300` cm^2/(V s), `q = 1.6E-19` C, `ni = 6.21E9` cm^-3, `rho = 6E6` V s cm/C'
notes = 'Unknown `N`, the doping density; by bisection and the modified secant method.'

[[rows]]
key = 'Prob. 8.32'
f = 'F = (1/(4*pi*e0))*q*Q*x/(x^2 + a^2)^(3/2)'
name = 'force of a charged ring on a point charge'
parameters = '`e0 = 8.85E-12` C^2/(N m^2), `q = Q = 2E-5` C, `a = 0.9` m, `F = 1` N'
notes = 'Unknown `x`, the distance of the charge from the center of the ring.'

[[rows]]
key = 'Prob. 8.33'
f = '1/Z = sqrt(1/R^2 + (omega*C - 1/(omega*L))^2)'
name = 'impedance of a parallel RLC circuit'
parameters = '`R = 225` ohm, `C = 0.6E-6` F, `L = 0.5` H, `Z = 75` ohm'
interval = '[1, 1000]'
notes = 'Unknown `omega`, the angular frequency. Bisection and false position to `es = 0.1%`, with a graph to explain any difficulties.'

[[rows]]
key = 'Prob. 8.34'
f = '1/sqrt(f) = 4*log10(Re*sqrt(f)) - 0.4'
name = 'von Karman equation'
parameters = '`Re` from 2500 to 1000000'
notes = 'Unknown `f`, the Fanning friction factor; the book gives typical values from 0.001 to 0.01, for `Re` from 10,000 to 500,000. A bisection function with an absolute error below 0.000005.'

[[rows]]
key = 'Prob. 8.35'
f = '2*k2*d^(5/2)/5 + (1/2)*k1*d^2 - m*g*d - m*g*h'
name = 'nonlinear spring'
parameters = '`k1 = 40000` g/s^2, `k2 = 40` g/(s^2 m^0.5), `m = 95` g, `g = 9.81` m/s^2, `h = 0.43` m'
notes = 'Unknown `d`, the deflection of a spring with resistance `F = -(k1*d + k2*d^(3/2))` when a mass `m` falls on it from height `h`; from conservation of energy.'

[[rows]]
key = 'Prob. 8.36'
f = 'cp = 0.99403 + 1.671E-4*T + 9.7215E-8*T^2 - 9.5838E-11*T^3 + 1.9520E-14*T^4'
name = 'specific heat of dry air'
parameters = '`cp = 1.2` kJ/(kg K)'
notes = 'Unknown `T` (K), the temperature at which the zero-pressure specific heat is 1.2.'

[[rows]]
key = 'Prob. 8.37'
f = 'y = tan(theta0)*x - g/(2*v0^2*cos(theta0)^2)*x^2 + y0'
name = 'trajectory of a thrown ball'
parameters = '`v0 = 20` m/s, `x = 40` m, `y0 = 1.8` m, `y = 1` m, `g = 9.81` m/s^2'
notes = 'Unknown `theta0`, the initial angle, in degrees; initial guesses from a graph.'

[[rows]]
key = 'Prob. 8.38'
f = 'sigma^3 - I*sigma^2 + II*sigma - III'
name = 'principal stresses'
parameters = '`I = sxx + syy + szz`, `II = sxx*syy + sxx*szz + syy*szz - sxy^2 - sxz^2 - syz^2`, `III = sxx*syy*szz - sxx*syz^2 - syy*sxz^2 - szz*sxy^2 + 2*sxy*sxz*syz`; `sxx = 10`, `syy = 7`, `szz = 16`, `sxy = 14`, `sxz = 25`, `syz = 15` MPa'
notes = 'Unknown `sigma`: its 3 roots are the principal stresses (MPa) of a 3-dimensional stress field; `I`, `II` and `III` are the stress invariants. With these stresses, `I = 33`, `II = -704` and `III = 1859`, which the book does not print.'

[[rows]]
key = 'Prob. 8.39'
f = 'v = u*log(m0/(m0 - q*t)) - g*t'
name = 'upward velocity of a rocket'
parameters = '`u = 2200` m/s, `m0 = 160000` kg, `q = 2680` kg/s, `g = 9.81` m/s^2, `v = 1000` m/s'
interval = '[10, 50]'
notes = "Unknown `t`, the time at which the velocity is 1000 m/s, to within 1%; the book's hint gives the interval. The book prints `ln`."

[[rows]]
key = 'Prob. 8.40'
f = 'tan(phi) = 2*(c/cc)*(omega/p)/(1 - (omega/p)^2)'
name = "phase angle of a car's forced vibration"
parameters = '`phi = omega/2 - 1`; `c/cc` and `p` not given'
notes = "Unknown `omega`, at which the phase angle between a rough road's forcing and the car's motion is `omega/2 - 1`. The problem takes `c/cc` and `p` from \"the section\", which Part Two does not contain; the book's text mentions the rough road nowhere else."

[[rows]]
key = 'Prob. 8.42'
f = 'HP = (z*R*T1/MW)*(n/(n - 1))*(Rc^((n - 1)/n) - 1)'
name = 'polytropic efficiency of a compressor'
parameters = '`HP = z*R*T1/MW`, `Rc = 3.0`'
notes = 'Unknown `n`, the polytropic efficiency of a compressor at compression ratio `Rc`, whose power requirement `HP` equals `z*R*T1/MW`, so that this factor cancels.'

[[rows]]
key = 'Prob. 8.48'
f = 'v = sqrt(4*g*(rho_s - rho)*d/(3*CD*rho))'
name = 'settling velocity of a spherical particle'
parameters = '`CD = 24/Re + 3/sqrt(Re) + 0.34` (P8.48.4), `Re = rho*d*v/mu` (P8.48.1); `g = 9.81` m/s^2; an iron particle in water: `d = 200` µm, `rho = 1` g/cm^3, `rho_s = 7.874` g/cm^3, `mu = 0.014` g/(cm s)'
notes = "(P8.48.3). Unknown `v`, the settling velocity of a particle of diameter `d` and density `rho_s` in a fluid of density `rho` and viscosity `mu`, beyond the laminar regime (`Re < 0.1`) of Stokes' law. (a) asks to combine the 3 equations into `f(v) = 0`, which the book does not print; (b) runs the modified secant method with `delta = 1E-3` to `es = 0.05%`, from the Stokes-law velocity (P8.48.2); (d) and (e) ask for a fixed-point iteration, which (P8.48.3) itself is, and a graph showing that it converges for any positive guess. The problem gives `g` in m/s^2 and the rest in cgs units."
