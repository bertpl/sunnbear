title = 'Romadani (2025): classical root-finding methods in Python'
reference = 'Romadani, M. N. H. (2025). From Theory to Code: Transforming Classical Root-Finding Methods into Efficient Python Implementations. ICCK Journal of Applied Mathematics 1(3), 154–189. https://doi.org/10.62762/jam.2025.840767.'
year = 2025
subcategory = '1.2'
where_in_source = '''
- Section 3.3, "Computational Experiment Design", lists 6 example test functions in 4 numbered classes; the article reports no results for them.
- Sections 5.1 to 5.4 test 7 methods on 1 function each (polynomial, trigonometric, exponential, mixed), with results in Tables 2, 4, 6 and 8. Each of these sections gives a bracketing interval, and Sections 5.2 to 5.4 also give a wider range used to search for the exact root.
'''
transcribed_from = 'the article, checked against the page images.'
rows_summary = '10: the 6 examples of Section 3.3 and the 4 functions of Section 5.'
notes = 'Keys are `3.3-<class>` for the examples of Section 3.3, with a letter added where a class holds 2 examples, and the section number for Sections 5.1 to 5.4.'

