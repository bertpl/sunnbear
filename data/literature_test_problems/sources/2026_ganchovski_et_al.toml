title = 'Ganchovski, Smith, Rackauckas, Tomov, Traykov (2026): improvements to modAB'
reference = "Ganchovski, N., Smith, O., Rackauckas, C., Tomov, L., Traykov, A. (2026). Improvements to the modified Anderson–Björck (modAB) root-finding algorithm. Algorithms 19(5), 332. https://doi.org/10.3390/a19050332. Supplementary materials: https://www.mdpi.com/article/10.3390/a19050332/s1, also in the folder `MDPI-Algorithms-Data` of the authors' repository https://github.com/Just-A-Random-Geek/ModAB-Root-Finding."
year = 2026
subcategory = '1.1'
where_in_source = '''
- The article's Table 2 (pp. 7–9), "Benchmark results for solving f_nn(x) = 0 in the interval [a; b]", gives 92 functions f01–f92, each on 1 interval. §5 names the origin of each block of functions.
- The supplementary `Test Functions.pdf` repeats each function with a plot and its root to 3 significant digits, and names f63–f92.
- The supplementary C# benchmark (`CSharp code/Numerical.Benchmark/Root.cs`) holds the functions and intervals that produced Table 2.
'''
transcribed_from = '''
the article's Table 2, checked against `Test Functions.pdf`, the C# code, and sunnbear's transcription in `tests/solvers/paper_problems/ganchovski_et_al.py`.
- sunnbear's transcription matches the C# code on every row.
- The rows follow the article, except f28, whose printed expression has an unmatched parenthesis; that row follows the C# code.
- The rows' notes list every difference between the article, `Test Functions.pdf` and the C# code; a source that a row's notes do not name agrees with the row.
'''
rows_summary = '92, 1 per function of Table 2.'
notes = '''
- **In the rows' notes, TF is `Test Functions.pdf` and C# is the C# code.**
- **`if(c; a; b)`** is the article's notation: `a` where `c` holds, `b` otherwise.
- **`log` is the natural log** in all 3 sources: the article prints `log`, TF prints `ln`, and C# calls `Math.Log`.
- **`name`** comes from TF, which names only f63–f92. The C# comments give the same names, except where the rows' notes say otherwise.
- **`also_in`** gives the origin that §5 of the article names for each block of functions. TF and the C# comments name the same origins, with 2 exceptions:
  - C# has no comment for Suhadolnik, so f51–f62 sit below its comment for Swift & Lindfield.
  - TF prints its heading "SciML Benchmarks test suite" above the row of plots that holds f83 and f84.
- **The origins**, as the article's reference list gives them:
  - **Galdino (2011)**, f01–f30: Galdino, S. A family of regula falsi root-finding methods. Proceedings of 2011 World Congress on Engineering and Technology, IEEE Press, Shanghai, pp. 514–517 (article ref. [16]). TF adds the URL http://sergiogaldino.pbworks.com/w/file/fetch/66011429/0130-1943543. Its rows are in `2011_galdino`.
  - **Ganchovski (2025)**, f31–f32: Ganchovski, N. Structural Analysis by Functional Modelling in the Cloud. PhD thesis, UACEG, Sofia, 2025 (ref. [7]). §5 calls these "Custom functions"; TF and C# call them "My functions".
  - **Stage (2013)**, f33–f40: Stage, S. A. Comments on An Improvement to the Brent's Method. Int. J. Exp. Algorithms 4 (2013), 1–16 (ref. [17]). Its rows are in `2013_stage`.
  - **Swift & Lindfield (1978)**, f41–f50: Swift, A., Lindfield, G. R. Comparison of a continuation method with Brent's method for the numerical solution of a single nonlinear equation. Comput. J. 21 (1978), 359–362 (ref. [18]). TF adds https://doi.org/10.1093/comjnl/21.4.359.
  - **Suhadolnik (2012)**, f51–f62: Suhadolnik, A. Combined bracketing methods for solving nonlinear equations. Appl. Math. Lett. 25 (2012), 1755–1760 (ref. [19]). TF adds https://doi.org/10.1016/j.aml.2012.02.006. Its rows are in `2012_suhadolnik`.
  - **Oliveira & Takahashi (2021)**, f63–f83: Oliveira, I., Takahashi, R. An Enhancement of the Bisection Method Average Performance Preserving Minmax Optimality. ACM Trans. Math. Softw. 47 (2021), 5 (ref. [5]). Its rows are in `2021_oliveira_takahashi`.
  - **SciML Benchmarks suite**, f84–f92: cited as Pal, A. et al. NonlinearSolve.jl: High-Performance and Robust Solvers for Systems of Nonlinear Equations in Julia. ACM Trans. Math. Softw. 52 (2026), 1 (ref. [11]). The rows of the suite are in `sciml_interval_suite`.
'''

