title = 'Galdino (2011): a family of regula falsi root-finding methods'
reference = "Galdino, S. (2011). A family of regula falsi root-finding methods. Proceedings of the 2011 World Congress on Engineering and Technology, IEEE Press, Shanghai, pp. 514–517. ISBN 978-1-61284-365-0. No DOI; the author's copy: http://sergiogaldino.pbworks.com/w/file/fetch/66011429/0130-1943543."
year = 2011
subcategory = '1.2'
where_in_source = '''
- Table II, "First set of functions used in numerical experiments of root-find methods", lists 23 functions `g1` to `g23` with simple zeros (case study 1, Section IV.A); Table III gives the function evaluations per function and method.
- Table IV, "Example functions for numerical comparisons of root-find methods", lists 7 functions `f1` to `f7` with multiple zeros (case study 2, Section IV.B); Table V gives the function evaluations. The appendix states the multiplicity of 4 of the 7 functions.
- A footnote to both tables says that each interval is an initial interval that holds the root.
'''
transcribed_from = "the article, checked against the page images. The article's Scilab script (Section IV) holds only `f1`."
rows_summary = '30: the 23 functions of Table II and the 7 of Table IV.'
notes = '''
- **Keys:** the labels of Tables III and V.
- **Families:** Table II writes 6 families with a parameter `n` and numbers each value `n = 5, 10, 20` as its own function, so each value is its own row.
- **`also_in`:** empty in every row. Section IV.A calls the functions of Table II "a series of published examples" and cites its references [5], [10], [11], [4] and [3], without saying which function comes from which.
'''

[[relations]]
sources = ['2026_ganchovski_et_al']
text = '''
Ganchovski et al. (2026) hold all 30 functions as f01–f30; the rows of `2026_ganchovski_et_al` follow their article.
- `g1`–`g23` are f01–f23 and `f1`–`f7` are f24–f30, in the same order.
- Ganchovski et al. write the value of `n` into each family's expression. Apart from that, 22 of the 30 rows have the same expression and interval in both sources; the other 8 are f02, f19, f20, f24–f27 and f29.
- **f02:** Galdino's `g2` ends in `- sqrt(3)/18`, as do Ganchovski et al.'s `Test Functions.pdf` and C# code; their article, and therefore the f02 row, has `- sqrt(x)/18`.
- **f19, f20:** Galdino prints `g19` and `g20` with the expression of `g16` and `g17`, `(1 + (1 - n)^4)*x - (1 - n*x)^4` at `n = 10, 20`. Ganchovski et al. have `exp(-n*x)*(x - 1) + x^n` at `n = 10, 20`, the expression of `g18`.
  - Problem 9 of Alefeld & Potra (1992) is `exp(-n*x)*(x - 1) + x^n` at `n = 5, 10, 20`, which confirms that Galdino's `g19` and `g20` are misprints and that Ganchovski et al.'s f19 and f20 are correct.
- **f24–f27 and f29:** the intervals differ; each item gives Galdino's interval, then the interval of the row of Ganchovski et al.:
  - f24: `[2.5, 3.5]` against `[2.6, 4.6]`;
  - f25: `[3.5, 4.5]` against `[3.6, 5.6]`;
  - f26: `[2, 3]` against `[2, 4]`;
  - f27: `[1, 2]` against `[1, 3]`;
  - f29: `[2.5, 3.5]` against `[2.6, 4.6]`.
- **f28:** Galdino prints `sin((x - 7.143)^3)`, the expression of the C# code that the f28 row follows.
'''

[[relations]]
sources = ['1992_alefeld_potra', '1993_alefeld_potra_shi']
text = '''
Galdino does not say which function comes from which of his references, but most of Table II is in Alefeld & Potra (1992).
- `g1`–`g4` and `g6`–`g23` are its problems 1 to 10, in the same order, with each of problems 5 to 10 at `n = 5, 10, 20`.
- The `x^2` of `g9`–`g11` comes from problem 6.
- Problem 11 is not in Galdino.
- Alefeld, Potra & Shi (1993) hold 9 of the 23 functions as printed.
- `g5` is in neither of the 2 articles.
'''

