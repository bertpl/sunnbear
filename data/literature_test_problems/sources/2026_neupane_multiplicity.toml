title = 'Neupane (2026): divided-difference multiplicity detection'
reference = 'Neupane, H. (2026). Divided-Difference Multiplicity Detection: A Derivative-Free, Perturbation-Robust Extension of Critical-Point Root Isolation. SSRN preprint 7203982, not peer reviewed. https://doi.org/10.2139/ssrn.7203982.'
year = 2026
