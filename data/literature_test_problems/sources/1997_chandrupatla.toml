title = 'Chandrupatla (1997): hybrid quadratic/bisection algorithm'
reference = 'Chandrupatla, T. R. (1997). A new hybrid quadratic/bisection algorithm for finding the zero of a nonlinear function without using derivatives. Advances in Engineering Software 28(3), 145–149. https://doi.org/10.1016/S0965-9978(96)00051-8.'
year = 1997
home = '1.1'
where_in_source = "Table 1, \"Test functions\" (p. 146), numbers the 9 functions and prints each one's zero. Table 2 (p. 147) gives the 5 intervals of each function. A superscript on a function's number in Table 1 cites the article's reference list."
transcribed_from = "the article's Tables 1 and 2, checked against sunnbear's transcription in `tests/solvers/paper_problems/chandrupatla.py`. That file holds all 9 functions and all 45 interval problems, and agrees with the article on every function, constant and interval. For function 7 it also holds a second version without the article's cutoff near 0."
rows_summary = '9, 1 per function number of Table 1. Table 2 solves each function on 5 intervals, 45 problems in all.'
notes = 'The `also_in` column gives the references that the superscripts of Table 1 cite. The rows of Brent (1973) are in `1973_brent_book`.'

