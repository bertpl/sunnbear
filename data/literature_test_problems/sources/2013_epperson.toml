title = 'Epperson (2013): An Introduction to Numerical Methods and Analysis, chapter 3'
reference = 'Epperson, J. F. (2013). An Introduction to Numerical Methods and Analysis, 2nd edition. John Wiley & Sons, Hoboken, NJ. ISBN 978-1-118-36759-9.'
year = 2013
subcategory = '1.4'
where_in_source = '''
chapter 3, "Root-Finding" (pp. 89–169): Examples 3.1–3.20, the text examples and figures of Sections 3.1–3.12, Tables 3.1–3.19, and the exercises that end each section.
- Section 4.4 (pp. 192–195) applies Muller's method and inverse quadratic interpolation to 2 functions of chapter 3; the rows of those 2 functions list Section 4.4's tables and exercises in their keys.
- Exercise 3 of Section 3.1 (rows keyed 3.1-3) is used again in 3.1-11 (regula falsi), 3.8-3 (secant from the interval's endpoints), 3.11-6 to 3.11-8 (chord method from the midpoint, with Aitken extrapolation) and 4.4-9 (Muller, inverse quadratic interpolation); the rows do not repeat those keys.
- The rows leave out:
  - exercises about a generic `f` or a method (for example 3.2-7, 3.2-8, 3.5-1 to 3.5-4, 3.6-1 to 3.6-7, 3.8-4 to 3.8-7);
  - the initial-guess polynomials of Sections 3.4 and 3.7;
  - 3.10-2(a), whose roots are all complex;
  - 3.10-7, a random polynomial.
'''
transcribed_from = "the book's PDF, whose text layer comes from OCR; every expression was read from the page images."
rows_summary = '82, 1 per distinct function: a function that several examples or exercises use is 1 row whose key lists them all. 20 rows come from the text, its examples and figures; 62 come from the exercises alone.'
notes = '''
How to read the rows:
- **Keys:** `Ex. 3.n` is Example 3.n; `3.k-m` is exercise m of Section 3.k, with its sub-item letter; `Fig.` and `Table` are the book's figures and tables; `§3.k (p. n)` is a text example.
- **Equations:** an equation that the book prints as `lhs = rhs` stays in that form, and a fixed-point iteration `x_{n+1} = g(x_n)` is written as the equation `x = g(x)`; `f(x) = 0` is written as `f(x)`.
- **Notation:** the book writes `ln` and `log` for the natural log, and `ε` where the rows write `eps`.
'''

