parameters = '`theta = 0.001, 0.1, 10, 1000` (3.1-8); `theta_k = 10^(k/4)`, `k = -24, ..., 24` (3.8-8)'
notes = 'From a model of melting (the Stefan problem): `beta` solves `((T_M - T_0)*k/(lambda*sqrt(pi)))*exp(-beta^2/k) = beta*erf(beta/sqrt(k))`, which 3.1-8(a) reduces to (3.6). Bisection (3.1-8), regula falsi (3.1-12), secant (3.8-8). Without a built-in `erf`, the book offers `E(z) = 1 - (a1*xi + a2*xi^2 + a3*xi^3)*exp(-z^2)` with `xi = 1/(1 + p*z)`, `p = 0.47047, a1 = 0.3480242, a2 = -0.0958798, a3 = 0.747856`.'

