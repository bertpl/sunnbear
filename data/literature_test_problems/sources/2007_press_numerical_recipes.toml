title = 'Press et al. (2007): Numerical Recipes, chapter 9'
reference = 'Press, W. H., Teukolsky, S. A., Vetterling, W. T., Flannery, B. P. (2007). Numerical Recipes: The Art of Scientific Computing, 3rd edition. Cambridge University Press, Cambridge. ISBN 978-0-511-33555-6 (e-book), 978-0-521-88068-8 (hardback).'
year = 2007
home = '1.4'
where_in_source = '''
chapter 9, "Root Finding and Nonlinear Sets of Equations", Sections 9.0–9.5 (pp. 442–473), its 1-dimensional parts. Sections 9.6–9.7 treat systems, and the rows leave them out.
- The chapter has no numbered examples, no tables of results and no exercises: its functions appear in the text.
- Section 9.1 (p. 445) cites eq. (3.0.1) of Section 3.0 (p. 111) as a root-finding example, so that function has a row too.
- The rows leave out Figures 9.1.1, 9.2.3, 9.4.2 and 9.4.3, which sketch functions without a formula, and Wilkinson's polynomial, which Section 9.5 only cites (Acton, 1970).
'''
transcribed_from = "the book's PDF, which has a text layer, checked against the page images."
rows_summary = '5, all from the text.'
notes = "**Keys** are the book's equation numbers where it numbers the function, else the section."

[[rows]]
key = '(3.0.1)'
f = '3*x^2 + (1/pi^4)*log((pi - x)^2) + 1'
notes = 'Section 9.1 cites it as a pathological example: it dips below 0 only within about `1E-667` of `x = pi`, where its 2 real roots lie. Section 3.0 defines it as a function that defeats interpolation near its mild singularity at `x = pi`.'

[[rows]]
key = '(9.1.1)'
f = '1/(x - c)'
parameters = '`c` free'
notes = 'No root: a bracket around `c` holds a sign change at the pole. The book: bisection converges to `c`, where `abs(f)` is large.'

[[rows]]
key = '9.4'
f = 'J0(x)'
name = 'Bessel function `J0`'
notes = "The book's example of the function object that `rtnewt` takes (p. 459). The text names the derivative `J1(x)`; the code returns `-J1(x)`. No interval or results printed."

[[rows]]
key = '(9.4.8)'
f = 'z^3 - 1'
notes = 'Real root `z = 1`. Section 9.4.1 maps the starting points from which Newton converges in the complex plane, with real and imaginary parts in `(-2, 2)` (Figure 9.4.4).'

[[rows]]
key = '9.5'
f = '(x - a)^2'
parameters = '`a` free'
notes = "Double root at `x = a` (p. 464): the book's example of a root that no sign change brackets."
