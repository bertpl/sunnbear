f = 'x^3 - 2*x - 5'
interval = '[2, 3]'
notes = 'Table 1 prints the final iterate `x_n` as `2.0945515532`; the root is `2.0945514815`.'

[[rows]]
key = 'T1.6'
f = '1/x - 1'
interval = '[0.5, 1.5]'
notes = 'Table 1 prints the final iterate `x_n` as `1.0000000000`.'
