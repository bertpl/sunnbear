title = 'Naghipoor, Ahmadian, Soheili (2008): an improved regula falsi method'
reference = "Naghipoor, J., Ahmadian, S. A., Soheili, A. R. (2008). An Improved Regula Falsi Method for Finding Simple Zeros of Nonlinear Equations. Applied Mathematical Sciences 2(8), 381–386. No DOI; the publisher's copy: https://www.m-hikari.com/ams/ams-password-2008/ams-password5-8-2008/soheiliAMS5-8-2008.pdf."
year = 2008
subcategory = '1.2'
where_in_source = '''
- Table 1 (Section 4, "Numerical experiments", p. 384) lists 6 equations, each with an initial interval, the iteration counts of classic regula falsi and of the article's improved method, and the final iterate `x_n`. Table 2 gives the CPU times of both methods on the same 6 equations.
- Section 4 stops each run when `|f(x_{i+1})| < eps` or `|x_{i+1} - x_i| < eps`, with `eps = 1E-10`, or after 200 iterations; Section 2 sets the method's parameter `alpha = 1`.
- The article cites no source for its functions.
'''
transcribed_from = 'the article (text layer), checked against the page images.'
rows_summary = "6: Table 1's 6 equations."
notes = '''
- **Keys:** the tables do not number the functions, so a key `T1.k` gives the position within Table 1.
- **`f`:** Table 1 prints each function as an equation `... = 0`; a row's `f` gives its left-hand side.
'''

[[relations]]
sources = ['2010_gottlieb']
text = '''
Tests 2–7 of Gottlieb & Thompson (2010) are `T1.1`–`T1.6`, in the same order and with the same expressions. The differences:
- **Test 1, `3*sin(x) - 2` on `[0, 1]`,** is not in this article, so it is the "additional test function of our own" that Gottlieb & Thompson mention.
- **Test 7 (`T1.6`, `1/x - 1`):** the interval is `[0.5, 1.5]` here and `[0.5, 2.0]` in Gottlieb.
- **Printed roots:** for `T1.1`, `T1.4` and `T1.5`, Table 1's `x_n` differs from Gottlieb's Table 2 root from the 7th decimal on; Gottlieb's roots are correct to the 10 decimals printed.
'''

[[relations]]
sources = ['roots_fortran']
text = "Cases 31–36 of roots-fortran are Gottlieb's tests 2–7, unchanged, so they differ from this article only in case 36's interval, `[0.5, 2]`."

[[rows]]
key = 'T1.1'
f = 'x*exp(x) - 1'
interval = '[-1, 1]'
notes = 'Table 1 prints the final iterate `x_n` as `0.5671433083`; the root is `0.5671432904`.'

[[rows]]
key = 'T1.2'
f = '11*x^11 - 1'
interval = '[0.1, 0.9]'
notes = 'Table 1 prints the final iterate `x_n` as `0.8041330975`.'

[[rows]]
key = 'T1.3'
f = 'exp(x^2 + 7*x - 30) - 1'
interval = '[2.8, 3.1]'
notes = 'Table 1 prints the final iterate `x_n` as `3.0000000000`.'

[[rows]]
key = 'T1.4'
f = '1/x - sin(x) + 1'
interval = '[-1.3, -0.5]'
notes = 'Table 1 prints the final iterate `x_n` as `-0.6294463362`; the root is `-0.6294464841`.'

[[rows]]
