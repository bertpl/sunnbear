notes = 'Printed root: `1.64872127070`; §5.2.3 calls it extremely flat around the root, compares 7 solvers at `tol = 1e-15` (`fzero` from starting point 2.2), and solves it with `ridders` on [1, 3.4] in 128-bit precision, as `f12a` with `exp(m1)` for `exp(1)`, `m1 = Rmpfr::mpfr(1.0, 128)`; it gives the true root as `sqrt(exp(1))`'

