title = 'Borchers (2026): pracma Handbook, chapter 5, Root Finding'
reference = 'Borchers, H. W. *pracma Handbook*, chapter 5, "Root Finding". https://hwborchers.lima-city.de/pracmaHandbook/rootfinding.html, accessed 2026-10-18. The page is unversioned and gives no author or date; it is on the website of Hans W. Borchers, the author of the R package pracma. The chapter cites no source for its test functions.'
year = 2026
home = '1.3'
where_in_source = '''
section 5.6, "Appendix: Test functions", an R code block that defines `f1`–`f12`, each with a comment that gives its interval and its root.

Of the examples elsewhere in the chapter, 1 gives a concrete function with an interval (§5.2.2); 2 others reuse `f6` (§5.1.1) and `f12` (§5.2.3). The rows leave out the following examples, because they give no interval:
- `sin(x)^2` and `x^a - b`, solved by Newton's method from a starting point (§5.1.4, §5.2.1);
- Riemann's zeta function and a degree-5 polynomial, solved in complex arithmetic from starting points (§5.3);
- polynomials solved from their coefficients (§5.4), among them a degree-100 polynomial that the text says was discussed on R-help;
- a system of 2 equations (§5.5).
'''
transcribed_from = "the chapter's web page: the R code of section 5.6 and of the examples."
rows_summary = "13: section 5.6's 12 functions and the example of §5.2.2."
notes = "**Printed root:** section 5.6 gives the root of each function to about 10 significant digits, with the digits grouped in 3s; `notes` gives it without the spaces."

