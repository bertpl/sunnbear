title = "Ridders (1979): Ridders' method"
reference = 'Ridders, C. J. F. (1979). A new algorithm for computing a single root of a real continuous function. IEEE Transactions on Circuits and Systems 26(11), 979–980. https://doi.org/10.1109/TCS.1979.1084580.'
year = 1979
home = '1.1'
where_in_source = '''
- Section I, "Method" (p. 979), works through the first iteration on 1 example.
- Section III, "Examples" (p. 980), prints the iterates of 5 runs on 3 functions.
'''
transcribed_from = "the article, a scan with a text layer, checked against the page images. sunnbear's `tests/solvers/bracketing/ridders/test_paper.py` uses the same functions and intervals."
rows_summary = "4: Section I's example and Section III's 3 functions. Section III runs 2 of its functions on 2 intervals each, 5 runs in all."
notes = "The article does not number the functions: key `I` is Section I's example, and keys `III.1` to `III.3` are Section III's functions in the order printed."

[[rows]]
key = 'I'
f = 'x^3 - x - 5'
interval = '[-1, 3]'
notes = 'Printed root: `1.904160859...`.'

[[rows]]
key = 'III.1'
f = 'x*exp(x) - 10'
interval = '`[-10, 10]`; `[-100, 100]`'
notes = 'Last printed iterate: `1.745528003`.'

[[rows]]
key = 'III.2'
f = 'tan(x)^tan(x) - 10^3'
interval = '`[1.3, 1.4]`; `[0, 1.5]`'
notes = 'Last printed iterate: `1.354710442`.'

[[rows]]
key = 'III.3'
f = 'sin(x)'
interval = '[10, 280]'
notes = "`x` is in degrees, so the root is `180`. The article calls it a trivial example. sunnbear's `test_paper.py` writes it as `sin(radians(x))`."
