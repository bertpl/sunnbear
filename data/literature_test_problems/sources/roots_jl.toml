title = 'Roots.jl (2026): the derivative-free and benchmark test problems of v3.0.11'
reference = '''
Roots.jl v3.0.11, the test folder https://github.com/JuliaMath/Roots.jl/tree/v3.0.11/test, MIT license. The functions of the rows are in 2 files:
- `test/test_derivative_free.jl`, https://github.com/JuliaMath/Roots.jl/blob/v3.0.11/test/test_derivative_free.jl
- `test/runbenchmarks.jl`, https://github.com/JuliaMath/Roots.jl/blob/v3.0.11/test/runbenchmarks.jl

The files cite 1 source: the comment `## multiplicity: http://ir.igsnrr.ac.cn/bitstream/311030/8840/1/%E4%BE%AF%E9%BA%9F%E7%A7%91(SCI)2.pdf` stands above `func13` in `test_derivative_free.jl`. The URL gives no title; its file name decodes to `侯麟科(SCI)2.pdf`.

The paper at the URL is Li et al. (2010): Li, X., Mu, C., Ma, J., Hou, L. (2011). Fifth-order iterative method for finding multiple roots of nonlinear equations. Numerical Algorithms 57(3), 389–398, published online in 2010. https://doi.org/10.1007/s11075-010-9434-5. Its rows are in `2010_li_multiple_roots`.
'''
year = 2026
subcategory = '1.3'
where_in_source = '''
2 files of the test folder.
- `test_derivative_free.jl` defines 20 problems `func1`–`func20` with the macro `@Func1`, and 1 more function `fn` in the test set "derivative free, non Float64".
- `runbenchmarks.jl` defines 10 problems `"f1"`–`"f10"` in the `Dict` `problems`, under the comment `# collection of doable problems`.

The rows leave out Roots.jl's other test sets, its copies of Alefeld–Potra–Shi, Galdino and the modAB benchmark, because the rows of those functions come from their own sources.
'''
transcribed_from = 'the code of both files.'
rows_summary = '31, 1 per function as the files name them: 21 from `test_derivative_free.jl` (the 20 problems cover 219 cases, 1 per starting point, and `fn` adds 1 starting point in 3 number types) and 10 from `runbenchmarks.jl`.'
notes = '''
The keys `func1`–`func20` and `fn` come from `test_derivative_free.jl`, and the keys `f1`–`f10` from `runbenchmarks.jl`.

How to read the rows of `test_derivative_free.jl`:
- **Starting points:** each problem gives `N` starting points `x0(n) = range(a, stop=b, length=N)[n]`, `n = 1, ..., N`: `N` evenly spaced points from `a` to `b`, both included. `notes` gives `N`, `a` and `b`. Each starting point is 1 case. The field `params = 1:N` only numbers the starting points; the function `val(_, x)` ignores it.
- **Intervals:** a problem has an interval only where the file computes its roots `alpha` with `find_zeros`, which searches an interval `[a, b]` for every root: `func2`, `func9`, `func10` and `func11`.
- **Roots:** each problem also gives a root or roots `alpha`, which the rows leave out; `run_df_tests` counts a result as a failure when `abs(minimum(result - alpha))` exceeds 1.
- **Comments** above the problems group them:
  - `# easy ones`: `func1`–`func3`;
  - `# wider range`: `func4`, `func5`;
  - `# once over hump, hard to get back to 0`: `func6`;
  - `# once outside of extrema, points away from zero`: `func7`;
  - `# should have some failures here`: `func8`–`func12`;
  - `## multiplicity: <URL>`: `func13`–`func18`;
  - `## hard w/o aggressive bracketing`: `func19`, `func20`.
- **`also_in`** gives the cited paper for all 6 of `func13`–`func18`; the file does not say which of them come from it.
- **Derivatives:** none are given; the Newton, Halley and Schröder runs use central differences `D(f)` and `D2(f)` with step `h = 1e-4`.

How to read the rows of `runbenchmarks.jl`:
- **Each problem is a tuple** `(function, x0, (a, b))`. The bracketing methods and `Roots.bisection` use the bracket `(a, b)`, and the derivative-free methods and `Roots.secant_method` start from `x0`; in `run_derivative_free`, only `Order0` starts from `x0`, and the other derivative-free methods get the bracket.
- **The file asserts** `fn(ab[1]) * fn(ab[2]) < 0` for every problem.
- **No derivatives** are given.
'''

