title = 'Tiruneh (2019): a modified three-point secant method'
reference = 'Tiruneh, A. T. (2019). A modified three-point Secant method with improved rate and characteristics of convergence. arXiv preprint 1902.09058, version 1 (the only one), 25 February 2019. https://arxiv.org/abs/1902.09058.'
year = 2019
home = '1.2'
where_in_source = '''
- Table 1 (Section 3.1, p. 11), "Comparison of result of iterations of the Three point Secant method with Newton and traditional Secant Methods", lists 7 functions with "regular" convergence, each with its root and 1 to 3 sets of 3 starting points.
- Table 2 (Section 3.2, p. 16), "Results of application of the proposed three point Secant method for cases in which either Newton or Secant method (or both) fail to converge", lists 7 more in the same form.
- The text of Sections 3.1 and 3.2 and Figures 4–9 discuss some of these functions again, and no other.
- The article cites no source for its functions.
'''
transcribed_from = "the article's page images: the formulas have no text layer."
rows_summary = "14: Table 1's 7 functions and Table 2's 7."
notes = '''
- **Keys:** the tables do not number the functions, so a key `T1.k` or `T2.k` gives the table and the position within it.
- **`f`:** each function is printed as `y = ...`; a row's `f` gives the right-hand side.
- **Starting points:** the method starts from 3 points, not from an interval, so no row has an `interval`; a row's `notes` give the starting points `x0, x1, x2` of each set and the stated root.
'''

[[relations]]
sources = ['roots_fortran']
text = '''
This is the article that the comment "A modified three-point Secant method with improved rate and characteristics of convergence" of roots-fortran means; the comment names no author and dates the article July 2019. The differences:
- Cases 63–68 are `T1.1`, `T1.2`, `T1.4`, `T1.5`, `T1.6` and `T1.7`, in order, with the same expressions. roots-fortran leaves out `T1.3` and all 7 functions of Table 2.
- The article gives starting points, not intervals. The brackets of cases 63–68 are roots-fortran's own; each holds the article's stated root.
'''

[[rows]]
key = 'T1.1'
f = 'x^3 + 4*x^2 - 10'
notes = 'Starting points `0.5, 0.55, 0.6` and `0.9, 0.95, 1.0`. Stated root `1.365230013414100`.'

[[rows]]
key = 'T1.2'
f = 'sin(x)^2 - x^2 + 1'
notes = 'Printed as `[sin(x)]^2 - x^2 + 1`. Starting points `-1.0, -0.975, -0.95` and `-3.5, -3.25, -3.0`. Stated root `-1.404491648215340`.'

[[rows]]
key = 'T1.3'
f = '(x - 2)*(x + 2)^4'
notes = 'Starting points `-3.1, -3.05, -3.0` for the stated root `-2`, and `1.4, 1.45, 1.5` for the stated root `2`. Section 3.1 calls it the equation "having roots of multiplicity".'

[[rows]]
key = 'T1.4'
f = '(x - 1)^6 - 1'
notes = 'Starting points `1.5, 1.55, 1.6`, `2.5, 2.55, 2.6` and `3.5, 3.55, 3.6`. Stated root `2`. Section 3.1 calls it a function with a root of multiplicity, but its root `2` is simple.'

[[rows]]
key = 'T1.5'
f = 'sin(x)*exp(x) + log(x^2 + 1)'
notes = 'Printed with `ln`. Starting points `-0.9, -0.85, -0.8` and `-0.7, -0.65, -0.6`. Stated root `-0.603231971557215`.'

[[rows]]
key = 'T1.6'
f = 'exp(x^2 + 7*x - 30) - 1'
notes = 'Starting points `4.0, 4.05, 4.1` and `4.4, 4.45, 4.5`. Stated root `3`.'

[[rows]]
key = 'T1.7'
f = 'x - 3*log(x)'
notes = 'Printed with `ln`. Starting points `2.0, 2.05, 2.1` and `0.4, 0.45, 0.5`. Stated root `1.857183860207840`.'

[[rows]]
key = 'T2.1'
f = '-x^4 + 3*x^2 + 2'
notes = 'Starting points `1, 1.5, 2.0` and `0.5, 0.55, 0.6`. Stated root `1.887207676120680`.'

[[rows]]
key = 'T2.2'
f = 'log(x)'
notes = 'The article does not state the base; the root `1` is the same for any base. Starting points `3.0, 3.25, 3.5`.'

[[rows]]
key = 'T2.3'
f = 'atan(x)'
notes = 'Printed as `Arctan(x)`. Starting points `3.0, 3.25, 3.5` and `-3.0, -3.25, -3.5`. Stated root `0`.'

[[rows]]
key = 'T2.4'
f = 'x^5 - x + 1'
notes = 'Starting points `2.0, 2.5, 3.0` and `7.0, 7.5, 8.0`. Stated root `-1.167303978261420`. Figures 7–9 show the iterates of the 3 methods.'

[[rows]]
key = 'T2.5'
f = '0.5*x^3 - 6*x^2 + 21.5*x - 22'
notes = 'Starting points `2.0, 2.5, 3.0` for the stated root `1.7639320225002100`, and `5.0, 5.5, 6.0` for the stated root `6.236067977499790`.'

[[rows]]
key = 'T2.6'
f = 'x^(1/3)'
notes = 'Starting points `1.0, 1.25, 1.5` and `-1.0, -1.25, -1.5`; the second set needs the real cube root for negative `x`. Stated root `0`. Figures 4–6 show the iterates of the 3 methods.'

[[rows]]
key = 'T2.7'
f = '10*x*exp(-x^2) - 1'
notes = 'Starting points `3.0, 3.25, 3.5` for the stated root `1.679630610428450`, and `-1.0, -1.5, -2.0` for the stated root `0.101025848315685`.'
