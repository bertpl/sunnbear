title = 'SciMLBenchmarks.jl (2026): the Interval Rootfinding Test Suite at commit 8a67931'
reference = 'SciMLBenchmarks.jl, "Interval Rootfinding Test Suite" by Fabian Gittins (the front matter of the file), file `benchmarks/IntervalNonlinearProblem/suite.jmd` at commit `8a67931f726eeb53604926a6dd6bfc750316b4c4`, https://github.com/SciML/SciMLBenchmarks.jl/blob/8a67931f726eeb53604926a6dd6bfc750316b4c4/benchmarks/IntervalNonlinearProblem/suite.jmd, MIT license. The file names no source for its functions; it calls them "a selection of challenging test functions from the literature".'
year = 2026
subcategory = '1.3'
where_in_source = '''
3 sections that define functions:
- "`Roots.jl` baseline" defines `f(u, p)`, solved for 100,000 random values of `p`;
- "A different function" defines `g(u)`;
- "Extended Test Suite with Challenging Functions" defines the vector `test_functions`: 8 named tuples `(name, f, interval, p)`, numbered by comments "Function 1" to "Function 8".
'''
transcribed_from = 'the code blocks of the file.'
rows_summary = '10: `f`, `g`, and the 8 functions of `test_functions`.'
notes = '''
How to read the rows:
- **Variables:** the functions take `u` and a parameter `p`, as in the code.
- **`name`** holds the `name` field of `test_functions`; `f` and `g` have none.
- **No derivatives** are given.
'''

[[relations]]
sources = ['2026_ganchovski_et_al', '2026_tomov_ganchovski_benchmark']
text = '''
The article of Ganchovski et al. (2026) (`2026_ganchovski_et_al`) attributes its f84–f92 to the SciML Benchmarks suite:
- **f84–f88, f90 and f91 equal functions 1–5, 7 and 8** with this file's `p` substituted, on the same intervals.
- **Ganchovski et al.'s names are this file's code comments**, such as "Polynomial with multiple roots" for function 1, not its `name` fields, such as "Wilkinson-like polynomial".
- **f89 differs from function 6:** both carry the comment's name "High oscillation function", but f89 is `sin(20*x) + 0.1*x - 0.1` on [-4.0, 5.0], and function 6 is `sin(20*u) + sin(u) + u - p` with `p = 2.0` on [-5.0, 5.0].
- **f92, `x^3 - 0.001` on [-10, 10], has no counterpart here**, and neither do f93–f100, which Tomov & Ganchovski's benchmark (`2026_tomov_ganchovski_benchmark`) lists under the same SciML heading.
- **Neither of the 2 sources has `f` or `g`.**
- The rows come from commit `8a67931` only.
'''

[[rows]]
key = 'f'
f = 'u*sin(u) - p'
parameters = 'p = 1.5 .* rand(N), N = 100_000, after `Random.seed!(42)`'
interval = '[0.0, 2.0]'
notes = 'section "`Roots.jl` baseline"; `p` is drawn uniformly from [0, 1.5), and each value is 1 solve'

[[rows]]
key = 'g'
f = 'exp(u) - 1e-15'
interval = '[-100.0, 0.0]'
notes = 'section "A different function"; the file gives the root as `u = - 15 * log(10)`; the solvers of `BracketingNonlinearSolve.jl` call it through `g(u, p) = g(u)`'

[[rows]]
key = '1'
f = '(u - 1)*(u - 2)*(u - 3)*(u - 4)*(u - 5) - p'
name = 'Wilkinson-like polynomial'
parameters = 'p = 0.05'
interval = '[0.5, 5.5]'
notes = 'comment: Polynomial with multiple roots'

[[rows]]
key = '2'
f = 'sin(u) - 0.5*u - p'
name = 'sin(x) - 0.5x'
parameters = 'p = 0.3'
interval = '[-10.0, 10.0]'
notes = 'comment: Trigonometric with multiple roots'

[[rows]]
key = '3'
f = 'exp(u) - 1 - u - u^2/2 - p'
name = 'exp(x) - 1 - x - x²/2'
parameters = 'p = 0.005'
interval = '[-2.0, 2.0]'
notes = 'comment: Exponential function (sensitive near zero)'

[[rows]]
key = '4'
f = '1/(u - 0.5) - 2 - p'
name = '1/(x-0.5) - 2'
parameters = 'p = 0.05'
interval = '[0.6, 2.0]'
notes = 'comment: Rational function with pole'

[[rows]]
key = '5'
f = 'log(u) - u + 2 - p'
name = 'log(x) - x + 2'
parameters = 'p = 0.05'
interval = '[0.1, 3.0]'
notes = 'comment: Logarithmic function'

[[rows]]
key = '6'
f = 'sin(20*u) + sin(u) + u - p'
name = 'sin(20x) + sin(x) + x'
parameters = 'p = 2.0'
interval = '[-5.0, 5.0]'
notes = 'comment: High oscillation function'

[[rows]]
key = '7'
f = 'u^3 - 2*u^2 + u - p'
name = 'x³ - 2x² + x'
parameters = 'p = 0.025'
interval = '[-1.0, 2.0]'
notes = 'comment: Function with very flat region'

[[rows]]
key = '8'
f = 'u*sin(1/u) - 0.1 - p'
name = 'x·sin(1/x) - 0.1'
parameters = 'p = 0.01'
interval = '[0.01, 1.0]'
notes = 'comment: Bessel-like function'
