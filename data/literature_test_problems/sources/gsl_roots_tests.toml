title = 'GSL (2024): the `roots` tests of release 2.8'
reference = 'GNU Scientific Library (GSL), release 2.8, files `roots/test_funcs.c` and `roots/test.c` (copyright Reid Priedhorsky, Brian Gough), https://cgit.git.savannah.gnu.org/cgit/gsl.git/tree/roots/?h=release-2-8. The files cite no source for their functions.'
year = 2024
home = '1.3'
where_in_source = '''
the files `test_funcs.c` and `test.c`.
- `test_funcs.c` defines 9 functions, each with its 1st derivative: `func1`–`func7`, `sin_f` and `cos_f`.
- `main` in `test.c` solves each bracket with GSL's 3 bracketing solvers (`bisection`, `brent`, `falsepos`), through `test_f`, and each starting point with its 3 derivative-based solvers (`newton`, `secant`, `steffenson`), through `test_fdf`.
- Expected failures run through `test_f_e` and `test_fdf_e`. `test_f_e` expects `gsl_root_fsolver_set` to reject the bracket; `test_fdf_e` expects the solver not to converge within 150 iterations.
'''
transcribed_from = 'the function bodies in `test_funcs.c` and the cases in `main` of `test.c`. Where the description string of a case and its code differ, the code wins (`func2`, `func5`).'
rows_summary = '9, 1 per function, covering 13 brackets (3 of them invalid) and 14 starting points (2 of them expected failures). Each case runs on 3 solvers, except 1 starting point that only `steffenson` runs, so `test.c` runs 79 cases.'
notes = '''
How to read the rows:
- **`name`** is empty: the files name the functions only by their C identifiers, which are the keys.
- **`interval`** holds the brackets that the solvers are expected to solve; invalid brackets and all starting points are in `notes`.
- **Each case also gives the expected root**, which the rows leave out.
- **Derivatives:** only the derivative-based solvers use them.
'''

[[rows]]
key = 'func1'
f = 'x^20 - 1'
interval = '[0.1, 2]'
notes = 'Starting points 0.9, 1.1; derivative given'

[[rows]]
key = 'func2'
f = 'sqrt(abs(x))*sign(x)'
interval = '[-1/3, 1]'
notes = "Starting point 0.001, where the case's description says `{1.001}`; the derivative given is `1/sqrt(abs(x))`, twice the exact derivative"

[[rows]]
key = 'func3'
f = 'x^2 - 1e-8'
interval = '[0, 1]'
notes = 'Starting point 1; derivative given'

[[rows]]
key = 'func4'
f = 'x*exp(-x)'
interval = '[-1/3, 2]'
notes = 'Starting point -2; expected failure from starting point 2, described as "max iterations x -> +Inf"; derivative given'

[[rows]]
key = 'func5'
f = '1/(1 + exp(x))'
notes = "No root (the file's comment: \"no roots!\"); 1 case, an expected failure from starting point 0, described as \"max iterations x -> -Inf, 1/(1 + exp(-x))\", with `-x` where the code has `x`; `test.c` builds the function for the bracketing solvers but runs no bracket on it; derivative given"

[[rows]]
key = 'func6'
f = '(x - 1)^7'
interval = '[0.9995, 1.0002]'
notes = 'Starting point 0.9, run by `steffenson` only; derivative given'

[[rows]]
key = 'sin_f'
f = 'sin(x)'
interval = '[3, 4], [-4, -3], [-1/3, 1]'
notes = 'Starting points 3.4, -3.3, 0.5; invalid brackets, which each bracketing solver is expected to reject: [4, 0], [1, 1], [0.1, 0.2]; derivative given'

[[rows]]
key = 'cos_f'
f = 'cos(x)'
interval = '[0, 3], [-3, 0]'
notes = 'Starting points 0.6, -2.5; derivative given'

[[rows]]
key = 'func7'
f = '-M_PI*x + M_E'
notes = "`M_PI` and `M_E` are pi and e; starting point 1.5, no bracket; the file's comment: \"linear function to test that solvers exit correctly when entered with an exact root\"; derivative given"
