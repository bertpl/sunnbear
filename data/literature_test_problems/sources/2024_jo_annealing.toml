name = '2-rotor Kuramoto synchronization'
parameters = '`Gamma01`, `Gamma10`, `Psi01`, `Psi10`; no values given'
interval = 'none'
notes = 'The unknown is `phi1`. Motivating example in the introduction; the article does not solve it.'
