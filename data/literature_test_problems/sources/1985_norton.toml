notes = "Group II: a simple zero, and an inflection point of order `n - 1` or `n` at or near it. The root is exactly 0; the article notes that Bus–Dekker's Algorithm R needs 362 evaluations for `x^3 + x` at `eps = 2^-62`, `eta = 2^-129`."

