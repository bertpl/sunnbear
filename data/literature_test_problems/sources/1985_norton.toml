f = '(1 + (1 - n)^4)*x - (1 - n*x)^4'
parameters = 'n = 2, 5, 10, 20'
interval = '[0, 1]'
also_in = 'as row 1'
notes = 'Group I; the article: 1 turning point and 1 inflection point in `[0, 1]`.'

[[rows]]
