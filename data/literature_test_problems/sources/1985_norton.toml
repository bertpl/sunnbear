interval = '[-1, 1]'
also_in = 'Cox (1970), "A bracketing technique for computing a zero of a function", Comput. J. 13, 101–102 (article ref. 5), whose tests the article follows'
notes = "A polynomial is kept only if its values at -1 and 1 differ in sign, and only if every routine's zero lies within `10*(2*eps*|x0| + eta)` of the zero that `zero1` finds with `N = 2`. The seed is not given."

