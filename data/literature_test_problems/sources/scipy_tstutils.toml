title = 'SciPy (2026): the `_tstutils` test problems of release 1.18.1'
reference = '''
SciPy 1.18.1, module `scipy/optimize/_tstutils.py`, https://github.com/scipy/scipy/blob/v1.18.1/scipy/optimize/_tstutils.py. The module cites 2 sources:
- [1] Alefeld, G. E., Potra, F. A. and Shi, Y., "Algorithm 748: Enclosing Zeros of Continuous Functions", ACM Trans. Math. Softw. (1995), https://dl.acm.org/doi/10.1145/210089.210111
- [2] Chandrupatla, T. R., "A new hybrid quadratic/bisection algorithm for finding the zero of a nonlinear function without using derivatives", Advances in Engineering Software 28.3 (1997): 145-149 (no DOI in the module)
'''
year = 2026
home = '1.3'
where_in_source = '''
4 collections of test cases, each returned by `get_tests(collection)`:
- `original` (`_ORIGINAL_TESTS`): 6 functions `f1`–`f6`, 6 test cases.
- `aps` (`_APS_TESTS`): 15 functions `aps01_f`–`aps15_f`, 154 test cases; the module says that they appear in [1].
- `complex` (`_COMPLEX_TESTS`): 2 complex-valued functions `cplx01_f`, `cplx02_f`, 6 test cases, with starting values and no bracket.
- `chandrupatla` (`_CHANDRUPATLA_TESTS`): 9 functions `fun1`–`fun9`, 45 test cases; the module says that they appear in [2].

The module docstring names only the first 3 collections. A list `functions = [f2, f3, f4, f5, f6]`, kept for backwards compatibility, adds no functions.
'''
transcribed_from = 'the code of the module in SciPy 1.18.1: function bodies and test-case lists. Where a docstring and the code differ, the code wins (`aps14_f`, `aps15_f`).'
rows_summary = "32, 1 per function (6 + 15 + 2 + 9), covering the module's 211 test cases (6 + 154 + 6 + 45)."
notes = '''
How to read the rows:
- **`name`** holds the function's docstring, since the module gives no other names; `fun1`–`fun9` have none.
- **Each test case also gives a root**, which the rows leave out. The `original` and `aps` cases add a start `x0` for Newton and Halley, which the rows also leave out; the `chandrupatla` cases add the number of function evaluations that Chandrupatla's algorithm needed.
- **Smoothness:** the `original`, `aps` and `complex` cases give an order of differentiability; it is `np.inf` unless `notes` states it.
- **Derivatives:** "derivatives given" means that the module defines `<name>_fp` and `<name>_fpp` (1st and 2nd derivative); only Newton-type methods (Newton, Halley) use them.
- **Test IDs** in `notes` follow the order of the parameter values or intervals in the row.
'''

[[rows]]
