[[rows]]
key = '(61)'
f = 'x^p - 10^(-3)'
name = 'f_p'
parameters = 'p = 3, 5, 7, 9, 11, 13, 15, 17'
interval = '[-10, 10]'
notes = 'Section 7.1 introduces it for odd `p` and discusses `p = 13, 15, 17`; equation (61) in Section 7.6 lists the 8 values.'

[[rows]]
key = '7.6-a'
f = '10^(-320)*(x - 1/4)^3'
interval = 'not given'
notes = 'Also in Section 7.1. The preprint writes it as a computed callback, `F`-hat. It is evaluated at `x = 0.26`, where it can return 0, to check that this machine zero fails root-location validation at tolerance `10^(-14)`.'

[[rows]]
key = '7.6-b'
f = 'x - 1/4'
interval = 'endpoint pairs `(1/4, 1)` and `(1, 1/4)`'
notes = 'The solver must return the endpoint root. The second pair gives the endpoints in reversed order.'

[[rows]]
key = '7.6-c'
f = 'x'
interval = '[-1, 1]'
notes = 'The evaluation at the midpoint is replaced by NaN; the solver must report invalid input.'

[[rows]]
key = '7.6-d'
f = 's*(x^3 - 2)'
parameters = 's = 1, 10^120'
interval = '[0, 2]'
notes = 'The check compares the returned values for the 2 values of `s`.'
