title = 'Alhseno (2026): Al-Hseno algorithm'
reference = 'Alhseno, M. (2026). Al-Hseno algorithm: a robust derivative-free root-finding method with adaptive multiplicity estimation, geometric damping, and curvature correction. Research Square preprint, posted 5 May 2026. https://doi.org/10.21203/rs.3.rs-9596848/v1.'
year = 2026
subcategory = '1.2'
where_in_source = '''
- Appendix A, "Complete Benchmark Suite: 43 Test Functions", lists functions 1 to 43, each with a "Challenge" label and a stated root `alpha`.
- Table 1 (Section 4.1) repeats functions 1 to 15, with shorter challenge labels; it writes function 4 as `prod_i (x - r_i) + 0.05*sin(50*x)`, without the `r_i`.
- Table 3 (Section 4.4) repeats functions 1, 5, 6, 8, 9, 12, 16, 17, 19 and 40.
- Section 4.5 computes basins of attraction for `z^3 - 1`, which Appendix A does not hold.
'''
transcribed_from = 'the article, checked against the page images.'
rows_summary = '44: the 43 functions of Appendix A and the basin function of Section 4.5.'
notes = '''
- The article gives no intervals and no starting points: the method starts from 2 points `x0`, `x1`, and Section 4.2 says each method was started "using the same starting points".
- Function 41 has no real root; the article uses it as a negative control.
- The article cites no source for its functions.
- Keys are the function numbers of Appendix A; the basin row is keyed by its section.
- `name` holds the challenge label of Appendix A, since the article gives no other names.
- `log` is the natural log: the stated roots of functions 2 and 23 solve the printed functions with it.
- **The stated roots of 5 functions do not solve the printed function** (functions 7, 35, 36, 39 and 40); the notes of these rows give the function's value at the stated root. The article prints these expressions legibly.
'''

