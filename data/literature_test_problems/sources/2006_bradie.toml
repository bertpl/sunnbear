title = 'Bradie (2006): A Friendly Introduction to Numerical Analysis, chapter 2'
reference = 'Bradie, B. (2006). A Friendly Introduction to Numerical Analysis. Pearson Prentice Hall, Upper Saddle River, NJ. ISBN 0-13-013054-0.'
year = 2006
subcategory = '1.4'
where_in_source = '''
chapter 2, "Rootfinding" (pp. 54–137): the chapter overview (pp. 54–58), Sections 2.1–2.7 with Examples 2.1–2.21, Tables 2.1–2.6, Figures 2.1–2.3, 2.7 and 2.9, the application problems, and the exercises that end each section.
- The overview of chapter 1 (p. 2) sets up the "Solving a Crime" problem; Section 2.5 solves its 2 equations, so their rows come from there.
- The rows leave out:
  - exercises about a method or a generic `f` (2.1-6 to 2.1-9, 2.2-2, 2.2-3, 2.2-12, 2.3-1 to 2.3-4, 2.4-2, 2.5-2 to 2.5-4, 2.6-1, 2.6-2, 2.6-16, 2.7-3);
  - Example 2.4, an inequality;
  - 2.7-13 and 2.7-14, chemical equilibria that the book states without an equation.
- Chapter 3 treats systems.
'''
transcribed_from = 'a scan of the book, which has no text layer; every expression was read from the page images.'
rows_summary = '85, 1 per distinct function: a function that several examples or exercises use is 1 row whose key lists them all. 26 rows come from the overview, the text, its examples, application problems and figures; 59 come from the exercises alone.'
notes = '''
How to read the rows:
- **Keys:** `Ex. 2.n` is Example 2.n; `2.k-m` is exercise m of Section 2.k, with its sub-item letter; `Table` and `Fig.` are the book's tables and figures; `§2.k (p. n)` is a text example or an application problem of Section 2.k, and `§2 (p. n)` one of the chapter overview.
- **Equations:** an equation that the book prints as `lhs = rhs` stays in that form; `f(x) = 0` is written as `f(x)`.
- **Fixed-point problems:** a fixed-point problem, which the book states as an iteration function `g` with `p_n = g(p_{n-1})`, is written as the equation `x = g(x)`, and is its own row apart from the root form `x - g(x)`, except where the book derives one from the other (Table 2.4, 2.4-7, 2.4-8).
- **Notation:** the book writes `ln` for the natural log and `cos^-1` for `arccos`; the rows write `log` and `arccos`. It prints intervals as open intervals `(a, b)`, and the rows keep them so.
'''

[[rows]]
key = '§2 (p. 54); §2.4 (p. 102)'
f = '(P + n^2*a/V^2)*(V - n*b) - n*R*T'
name = 'van der Waals equation'
parameters = '`n = 1` mole of chlorine, `P = 2` atm, `T = 313` K, `a = 6.29` atm liter^2/mole^2, `b = 0.0562` liter/mole, `R = 0.08206` atm liter/(mole K)'
notes = 'Unknown `V`, the volume in liters. The overview prints the equation `(P + n^2*a/V^2)*(V - n*b) = n*R*T`; Section 2.4 runs Newton to `5E-7` from the ideal-gas volume `V0 = 12.84239`, reaching `V = 12.6510993` in 3 iterations.'

[[rows]]
key = '§2 (p. 55); §2.2 (p. 78); 2.2-15'
f = '(rho_f/3)*h^3 - R*rho_f*h^2 + (4/3)*R^3*rho_o'
name = 'depth of submersion'
parameters = '`R = 5` cm, `rho_o = 0.120`, `rho_f = 0.890` g/cm^3 (§2.2)'
interval = '`(0, 10)` (§2.2)'
notes = "Unknown `h`, the depth to which a sphere of radius `R` and density `rho_o` sinks in a fluid of density `rho_f`; the derivation assumes the sphere is not fully submerged. False position on `(0, 10)` with tolerance `5E-5` gives `p5 = 2.3043353119`. 2.2-15 reworks the problem for a glass marble, `R = 2`, `rho_o = 0.040`, `rho_f = 0.998`, and gives no interval. Its physical root is about 0.48212. On `(0, 10)` that cubic has no sign change: it also has the root 5.96394 there, beyond the marble's diameter `2*R = 4`, where the derivation no longer holds."

[[rows]]
key = '§2 (p. 56)'
f = 'x^6 + x^5 - 12*x^4 + 2*x^3 + 41*x^2 - 51*x + 18'
notes = "Printed also as `(x - 1)^3*(x + 3)^2*(x - 2)`: a triple root at 1, a double root at -3 and a simple root at 2. The book's example of multiplicity."

[[rows]]
key = '§2 (pp. 56–57)'
f = '2*x + log((1 - x)/(1 + x))'
notes = "Root 0 of multiplicity 3: `f(0) = f'(0) = f''(0) = 0`, `f'''(0) = -4`."

[[rows]]
key = '§2 (p. 58)'
f = '3*x^2 + (1/pi^4)*log((pi - x)^2) + 1'
interval = '`(pi - 1, pi)`; `(pi, pi + 1)`'
notes = "Undefined at `x = pi`. 2 simple real roots, 1 in `(pi - 1, pi)` and 1 in `(pi, pi + 1)`, both at about `pi ± 10^-647`, which no floating-point system resolves: the book's pathological example."

[[rows]]
key = '§2.1 (p. 59); Ex. 2.1–2.3, 2.8, 2.9, 2.11–2.13; Tables 2.1–2.3, 2.5, 2.6; Fig. 2.1; §2.2 (p. 74); §2.4 (p. 98); 2.1-10; 2.2-10; 2.4-13; 2.5-12 to 2.5-14, 2.5-17'
f = 'x^3 + 2*x^2 - 3*x - 1'
interval = '`(1, 2)`; `(-3, -2)`; `(-1, 0)`'
notes = "The chapter's first standard test problem: 3 simple roots, 1 in each interval, among them `1.1986912435` and `-2.9122291785`. Bisection with tolerance `5E-5` on `(1, 2)` (Ex. 2.1, 2.2, Table 2.1) and on the other 2 intervals (2.1-10); false position on `(1, 2)` and `(-3, -2)` (Ex. 2.3, Tables 2.2, 2.3), and with Aitken extrapolation (Ex. 2.13); Newton from `p0 = 1, 2, 3` (Ex. 2.8, 2.9, Table 2.6) and from `p0 = -3, -2.5, -2` (Table 2.5, p. 98); secant from `p0 = 2, p1 = 1` (Ex. 2.11, 2.12), from `p0 = -2, p1 = -3` (2.5-12) and from the 8 pairs of 2.5-13 and 2.5-14. 2.2-10, 2.4-13 and 2.5-17 seek the root in `(-1, 0)` to `5E-5`."

