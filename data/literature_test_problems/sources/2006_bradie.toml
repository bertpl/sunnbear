notes = 'Root 1; the real 7th root. Figure only, plotted on `[0, 2]`: nearly vertical at the root, so `x` within `1E-7` of it still gives `f` about `1E-1`.'

[[rows]]
key = 'Ex. 2.2; Fig. 2.3; Tables 2.2, 2.3, 2.5; §2.2 (p. 74); §2.4 (pp. 98, 100); §2.5 (p. 109); 2.1-13; 2.5-15; 2.6-3'
f = 'tan(pi*x) - x - 6'
interval = '`(0.40, 0.48)`; `[0, 0.48]` (§2.4, p. 100); `[0, 0.5]` (Fig. 2.3)'
notes = "The second standard test problem: infinitely many roots; the smallest positive one is `0.4510472588`. `tan(pi*x)` has a pole at `x = 0.5`, the right bound of Fig. 2.3's interval. Bisection and false position on `(0.40, 0.48)` (Ex. 2.2, Tables 2.2, 2.3, p. 74; Aitken on the false-position sequence in 2.6-3). Newton from `p0 = 0.48` converges in 5 iterations; from `p0 = 0.4` it does not converge in 5000; from `p0 = 0` it converges to the root `697.4995475` (p. 98). Secant from `p0 = 0.4, p1 = 0.48` (p. 109) and from `(0, 0.48)`, `(0.24, 0.48)`, `(0.4, 0.48)` (2.5-15). 2.1-13 seeks the next smallest positive root."

