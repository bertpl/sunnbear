notes = 'Unknown `r`, the annual interest rate, compounded monthly over 3 years. `f(0.01) = -1956.54`, `f(0.10) = 3645.91`; bisection to `5E-6` gives `r = 0.0439395` after 15 iterations. 2.5-20 asks the same for `13000, 200, 20000` and `13000, 250, 20000`, and gives no interval: since `13000 + 36*200 = 20200` already exceeds 20000, the goal is met even at `r = 0`, and both roots are negative, about -0.0041 and -0.0405.'

