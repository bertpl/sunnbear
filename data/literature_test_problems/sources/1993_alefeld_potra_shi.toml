title = 'Alefeld, Potra, Shi (1993): on enclosing simple roots of nonlinear equations'
reference = 'Alefeld, G., Potra, F. A., Shi, Y. (1993). On enclosing simple roots of nonlinear equations. Mathematics of Computation 61(204), 733–744. https://doi.org/10.1090/s0025-5718-1993-1192965-2.'
year = 1993
subcategory = '1.2'
where_in_source = '''
- Table 5.1, "Test problems" (p. 741), lists 14 functions with their intervals and parameters.
- Section 5 also solves `x^n = 0` on `[-1, 10]`, to compare the methods with bisection; Table 5.3 gives the evaluation counts on `x^n`.
- Tables 5.2 and 5.3 give total evaluation counts only, at `tol = 10^-7, 10^-10, 10^-15` and 0.
'''
transcribed_from = 'the article, a scan with a text layer, read from the page images. No code accompanies the article.'
rows_summary = "15: Table 5.1's 14 functions and the `x^n` problem of Section 5. The article counts 145 cases for Table 5.1, the number that its parameter column gives."
notes = '''
- **Keys:** Table 5.1 numbers neither its functions nor its rows, so the keys `T5.1-1` to `T5.1-14` count the functions in printed order. The `x^n` problem of Section 5 has the key `T5.3`.
- **Notation:** the parameter column of Table 5.1, and the rows' `parameters`, write the values from `a` to `b` in steps of `s` as `a(s)b`.
- **`also_in`:** empty in every row, because the article does not say where its test problems come from. Its bibliography lists Anderson and Björck (1973), Atkinson (1989) and King (1976), which the text does not cite.
'''

[[relations]]
sources = ['1995_alefeld_potra_shi']
text = '''
`T5.1-1` to `T5.1-11` are problems 1 to 11 of Table I of Alefeld, Potra & Shi (1995), and `T5.1-12` to `T5.1-14` its problems 13 to 15, in the same order and with the same expressions. The differences:
- Problem 12 of the 1995 article, `x^(1/n) - n^(1/n)`, is not here, and `T5.3` is not in the 1995 table.
- `T5.1-2` (problem 2): `n = 1(1)19`, where 1995 has `n = 1(1)10`.
- `T5.1-4` (problem 4): the second interval is `[0.95, 4.05]`, where 1995 has `[-0.95, 4.05]`.
- `T5.1-6` (problem 6): `n = 1(1)5, 15, 20`, where 1995 has `n = 1(1)5, 20(20)100`.
- `T5.1-7` (problem 7): `n = 1, 2, 5, 10, 15, 20`, where 1995 has `n = 5, 10, 20`.
- `T5.1-8` (problem 8): `n = 1, 2, 5, 10, 15, 20`, where 1995 has `n = 2, 5, 10, 15, 20`.
'''

[[relations]]
sources = ['2011_galdino']
text = '''
This article holds 9 of the 23 functions of Table II of Galdino (2011) as printed, and 10 with `g19` and `g20` as Ganchovski et al. (2026) read them:
- `T5.1-6` holds `g6` and `g8` (`n = 5, 20`), but not `g7` (`n = 10`).
- `T5.1-8` holds `g12`–`g14`.
- `T5.1-9` holds `g15` and `g17` (`n = 5, 20`), and `g20` as printed, but not `g16` (`n = 10`).
- `T5.1-10` holds `g18`, and `g19` and `g20` as Ganchovski et al. read them.
- `T5.1-7` has `x` where `g9`–`g11` have `x^2`.
'''

[[relations]]
sources = ['1985_norton']
text = '`T5.3` is function 11 of Norton (1985), with the same values of `n` and the same interval.'

[[rows]]
key = 'T5.1-1'
f = 'sin(x) - x/2'
interval = '[pi/2, pi]'

[[rows]]
key = 'T5.1-2'
f = '-2*sum((2*i - 5)^2/(x - i^2)^3, i = 1..20)'
parameters = 'n = 1(1)19'
interval = '`[a_n, b_n]` with `a_n = n^2 + 10^(-9)`, `b_n = (n + 1)^2 - 10^(-9)`'
notes = '`n` only selects the interval between the poles at `n^2` and `(n + 1)^2`; `f` has no parameter.'

[[rows]]
key = 'T5.1-3'
f = 'a*x*exp(b*x)'
parameters = '`a = -40, b = -1`; `a = -100, b = -2`; `a = -200, b = -3`'
interval = '[-9, 31]'
notes = "Here `a` and `b` are the function's parameters, not the interval's endpoints."

[[rows]]
key = 'T5.1-4'
f = 'x^n - a'
parameters = 'on `[0, 5]`: `a = 0.2, 1`, `n = 4(2)12`; on `[0.95, 4.05]`: `a = 1`, `n = 8(2)14`'
interval = '`[0, 5]`; `[0.95, 4.05]`'
notes = 'The table pairs each interval with the parameter line beside it. The second interval is printed legibly as `[0.95, 4.05]`, where Alefeld, Potra, Shi (1995) print `[-0.95, 4.05]`.'

[[rows]]
key = 'T5.1-5'
f = 'sin(x) - 0.5'
interval = '[0, 1.5]'
notes = 'Printed in the same ruled row as `T5.1-4`.'

[[rows]]
key = 'T5.1-6'
f = '2*x*exp(-n) - 2*exp(-n*x) + 1'
parameters = 'n = 1(1)5, 15, 20'
interval = '[0, 1]'

[[rows]]
key = 'T5.1-7'
f = '(1 + (1 - n)^2)*x - (1 - n*x)^2'
parameters = 'n = 1, 2, 5, 10, 15, 20'
interval = '[0, 1]'
notes = 'The article writes the first factor in square brackets.'

[[rows]]
key = 'T5.1-8'
f = 'x^2 - (1 - x)^n'
parameters = 'n = 1, 2, 5, 10, 15, 20'
interval = '[0, 1]'

[[rows]]
key = 'T5.1-9'
f = '(1 + (1 - n)^4)*x - (1 - n*x)^4'
parameters = 'n = 1, 2, 4, 5, 8, 15, 20'
interval = '[0, 1]'
notes = 'The article writes the first factor in square brackets.'

[[rows]]
key = 'T5.1-10'
f = 'exp(-n*x)*(x - 1) + x^n'
parameters = 'n = 1, 5, 10, 15, 20'
interval = '[0, 1]'

[[rows]]
key = 'T5.1-11'
f = '(n*x - 1)/((n - 1)*x)'
parameters = 'n = 2, 5, 15, 20'
interval = '[0.01, 1]'

[[rows]]
key = 'T5.1-12'
f_description = '`0` if `x = 0`; `x*exp(-x^(-2))` otherwise'
interval = '[-1, 4]'

[[rows]]
key = 'T5.1-13'
f_description = '`n/20*(x/1.5 + sin(x) - 1)` if `x >= 0`; `-n/20` otherwise'
parameters = 'n = 1(1)40'
interval = '[-10^4, pi/2]'

[[rows]]
key = 'T5.1-14'
f_description = '`e - 1.859` if `x > 2*10^(-3)/(1 + n)`; `exp((n + 1)*x/2*10^3) - 1.859` if `x` in `[0, 2*10^(-3)/(1 + n)]`; `-0.859` if `x < 0`'
parameters = 'n = 20(1)40, 100(100)1000'
interval = '[-10^4, 10^(-4)]'
notes = 'The print puts all of `(n + 1)*x/2*10^3` in the exponent.'

[[rows]]
key = 'T5.3'
f = 'x^n'
parameters = 'n = 3, 5, 7, 9, 19, 25'
interval = '[-1, 10]'
notes = "Stated as `x^n = 0` in Section 5: a multiple zero at 0. Not among Table 5.1's 145 cases."
